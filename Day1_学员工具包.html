<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加5磅 Day1 学员工具包（M1–M4）</title>
<style>
:root{
  --paper:#ffffff; --bg:#f5f5f0; --ink:#1a1a1a; --ink-soft:#5a5a5a;
  --brand:#1a2332; --accent:#c9a84c; --line:#e8e4dc;
  --ok:#1a3a2a; --warn:#8a6d1b; --bad:#8a2a2a;
  --gold-soft:#f7f1e3; --brand-soft:#e8ecf0;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
  font-size:15.5px; line-height:1.75;
}
h1,h2,h3,h4,.sans,nav,button,label,.tag,.chip,.q-opt,.sop-note{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
}
header{
  background:var(--paper); border-bottom:3px solid var(--accent);
  padding:26px 20px 18px; text-align:center;
}
header h1{margin:0 0 6px; font-size:24px; color:var(--brand); letter-spacing:2px; font-weight:700;}
header .sub{color:var(--ink-soft); font-size:13.5px; line-height:1.7;}
.wrap{max-width:1080px; margin:0 auto; padding:0 18px 60px;}
nav.tabs{
  position:sticky; top:0; z-index:20; background:var(--bg);
  display:flex; flex-wrap:wrap; gap:6px; padding:14px 0 10px;
  border-bottom:1px solid var(--line);
}
nav.tabs button{
  border:1px solid var(--line); background:var(--paper); color:var(--ink-soft);
  padding:8px 18px; border-radius:999px; font-size:15px; cursor:pointer;
  transition:all .2s ease;
}
nav.tabs button:hover{border-color:var(--accent); color:var(--brand); background:#faf8f3;}
nav.tabs button.active{background:linear-gradient(135deg, var(--brand) 0%, #243044 100%); border-color:var(--brand); color:#fff; box-shadow:0 2px 6px rgba(26,35,50,.18);}
.chip-row{display:flex; flex-wrap:wrap; gap:8px; padding:12px 0 4px;}
.chip{
  border:1px solid var(--line); background:transparent; color:var(--ink-soft);
  padding:4px 14px; border-radius:999px; font-size:13px; cursor:pointer;
}
.chip.active{background:var(--accent); border-color:var(--accent); color:#fff;}
section.tab-panel{display:none; padding-top:18px;}
section.tab-panel.active{display:block;}
.sec-intro{color:var(--ink-soft); font-size:14px; margin:6px 0 14px;}
.tag{display:inline-block; font-size:12px; padding:1px 9px; border-radius:4px;
  background:var(--brand-soft); color:var(--brand); border:1px solid #cdd5de; margin-right:6px;}
.tag.gold{background:var(--gold-soft); color:#7a5c10; border-color:#e4d9b8;}

/* ===== 翻卡 ===== */
.card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(285px,1fr)); gap:16px;}
.flip{perspective:1200px; height:230px; cursor:pointer;}
.flip-inner{position:relative; width:100%; height:100%; transition:transform .55s; transform-style:preserve-3d;}
.flip.on .flip-inner{transform:rotateY(180deg);}
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border:1px solid var(--line); border-radius:10px; background:var(--paper);
  padding:16px 16px 14px; overflow:auto; box-shadow:0 1px 3px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.06);
}
.face.back{transform:rotateY(180deg); background:#eee9dd; border-color:#d8d0be;}
.face .fhead{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.face .fch{font-size:12px; color:var(--brand); font-family:"PingFang SC",sans-serif;}
.face .hint{font-size:11.5px; color:var(--ink-soft); font-family:"PingFang SC",sans-serif;}
.face .ftext{font-size:15px;}
.face.back .ftext{font-size:13.8px; color:#2a2820;}
.flip-tip{font-size:13px; color:var(--ink-soft); margin:0 0 12px;}

/* ===== 自测 ===== */
.q-card{
  background:var(--paper); border:1px solid var(--line); border-radius:10px;
  padding:16px 18px; margin-bottom:14px;
}
.q-card.right{border-color:#a8c5b8; background:#f2f7f4;}
.q-card.wrong{border-color:#dfb9b9; background:#fbf3f3;}
.q-title{font-weight:bold; margin-bottom:10px; font-family:"PingFang SC",sans-serif; font-size:15px;}
.q-title .qno{color:var(--brand); margin-right:6px;}
.q-opt{display:block; padding:5px 10px; margin:4px 0; border-radius:6px; cursor:pointer; font-size:14.5px;}
.q-opt:hover{background:#f5f0e3;}
.q-opt input{margin-right:8px;}
.q-opt.ok-opt{background:#e2ede7; color:#1a3a2a; font-weight:bold;}
.q-opt.bad-opt{background:#f3e0e0; color:#8a3333;}
.q-ex{display:none; margin-top:10px; padding:10px 12px; border-left:3px solid var(--accent);
  background:#faf6ec; font-size:13.5px; color:#3a362c; border-radius:0 6px 6px 0;}
.q-card.graded .q-ex{display:block;}
.q-verdict{font-family:"PingFang SC",sans-serif; font-size:13px; font-weight:bold; margin-left:8px;}
.q-verdict.ok{color:var(--ok);} .q-verdict.no{color:var(--bad);}
.btn{
  font-family:"PingFang SC",sans-serif; font-size:15px; cursor:pointer;
  border:1px solid var(--brand); background:linear-gradient(135deg, var(--brand) 0%, #243044 100%); color:#fff;
  padding:9px 26px; border-radius:8px; margin:6px 8px 6px 0;
  transition:all .2s ease; box-shadow:0 1px 3px rgba(26,35,50,.10);
}
.btn:hover{box-shadow:0 3px 10px rgba(26,35,50,.18); transform:translateY(-1px);}
.btn.ghost{background:transparent; color:var(--brand); border-color:var(--brand);}
.btn.ghost:hover{background:var(--brand-soft);}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.score-banner{
  display:none; background:var(--paper); border:2px solid var(--accent); border-radius:10px;
  padding:18px 22px; margin:16px 0; text-align:center;
}
.score-banner h3{margin:0 0 6px; color:var(--brand);}
.review-list{text-align:left; max-width:760px; margin:12px auto 0; font-size:14px;}
.review-list li{margin-bottom:6px;}

/* ===== SOP决策卡 ===== */
.sop-toolbar{text-align:center; margin:10px 0 18px;}
.sop-card{
  background:#fff; border:1px solid var(--line); border-radius:8px;
  max-width:100%; margin:0 auto 26px; padding:22px 26px;
  box-shadow:0 1px 3px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.07);
}
.sop-card h3{color:var(--brand); border-bottom:2px solid var(--accent); padding-bottom:8px;
  margin:0 0 6px; font-size:19px;}
.sop-card h4{font-size:15px; color:var(--accent); margin:16px 0 6px;}
.flow-box{border:1px dashed var(--accent); border-radius:8px; padding:10px 14px; margin:8px 0; background:#faf8f2; font-size:13.5px;}
.flow-step{font-family:"PingFang SC",sans-serif; font-weight:bold; color:var(--brand);}
.sop-note{font-size:12.5px; color:var(--ink-soft); background:#faf6ec; border-left:3px solid var(--accent);
  padding:8px 12px; border-radius:0 6px 6px 0; margin-top:12px;}
.sop-card table{width:100%; border-collapse:collapse; font-size:13px; margin:8px 0;}
.sop-card th,.sop-card td{border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top;}
.sop-card th{background:var(--brand); color:#fff; font-family:"PingFang SC",sans-serif; font-weight:600;}
.redline{color:var(--bad); font-weight:bold;}

/* ===== 计算器 ===== */
.subtabs{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 18px;}
.subtabs button{
  font-family:"PingFang SC",sans-serif; font-size:14px; cursor:pointer;
  border:1px solid var(--line); background:var(--paper); color:var(--ink-soft);
  padding:7px 16px; border-radius:8px;
}
.subtabs button.active{background:linear-gradient(135deg, var(--accent) 0%, #b89530 100%); border-color:var(--accent); color:#fff; box-shadow:0 2px 6px rgba(201,168,76,.22);}
.tool-panel{display:none;}
.tool-panel.active{display:block;}
.tool-card{
  background:var(--paper); border:1px solid var(--line); border-radius:10px;
  padding:20px 22px; max-width:860px; margin:0 auto;
  box-shadow:0 1px 3px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.06);
}
.tool-card h3{margin:0 0 4px; color:var(--brand); font-size:18px;}
.tool-card .formula{font-size:13.5px; color:var(--ink-soft); background:var(--gold-soft);
  border-radius:6px; padding:8px 12px; margin:10px 0; font-family:"PingFang SC",sans-serif;}
.form-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px 18px; margin:14px 0;}
.field{display:flex; flex-direction:column; font-family:"PingFang SC",sans-serif; font-size:13.5px;}
.field label{color:var(--ink-soft); margin-bottom:3px;}
.field input,.field select{
  padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:15px;
  background:#fff; color:var(--ink); font-family:inherit;
}
.result{display:none; margin-top:16px; border-top:1px dashed var(--line); padding-top:14px;}
.result.show{display:block;}
.result .big{font-family:"PingFang SC",sans-serif; font-size:26px; font-weight:bold; color:var(--brand);}
.verdict-box{border-radius:8px; padding:12px 16px; margin:12px 0; font-size:14.5px; font-family:"PingFang SC",sans-serif;}
.verdict-box.green{background:#e6f0ea; border:1px solid #a8c5b8; color:#1a3a2a;}
.verdict-box.yellow{background:var(--gold-soft); border:1px solid #ddd0a8; color:#6a4e10;}
.verdict-box.red{background:#f8e8e8; border:1px solid #dfb9b9; color:#8a3333;}
.verdict-box h4{margin:0 0 6px; font-size:16px;}
.result table{width:100%; border-collapse:collapse; font-size:13.5px; margin:10px 0;}
.result th,.result td{border:1px solid var(--line); padding:6px 9px; text-align:left;}
.result th{background:var(--brand); color:#fff; font-family:"PingFang SC",sans-serif; font-weight:600;}
.disclaimer{
  margin-top:18px; font-size:12.8px; color:var(--ink-soft); background:#faf8f2;
  border:1px solid var(--line); border-radius:8px; padding:10px 14px; font-family:"PingFang SC",sans-serif;
}
footer{text-align:center; color:var(--ink-soft); font-size:12.5px; padding:24px 0 10px;
  border-top:1px solid var(--line); margin-top:30px; font-family:"PingFang SC",sans-serif;}

@media print{
  header,nav.tabs,.chip-row,.sop-toolbar,footer,.no-print{display:none !important;}
  body{background:#fff;}
  section.tab-panel{display:none !important;}
  #tab-sop{display:block !important;}
  .sop-card{box-shadow:none; border:1px solid #999; page-break-after:always; max-width:100%;}
}
</style>
</head>
<body>
<header>
  <h1>加5磅 · Day1 学员工具包</h1>
  <div class="sub">M1 教练必知生化基础 · M2 训练的营养依据 · M3 能量与宏量营养素 · M4 营养评估DAB<br>
  配套实操学习工具 ｜ 全部公式与阈值取自讲义原文</div>
</header>
<div class="wrap">

<nav class="tabs">
  <button data-tab="cards" class="active">知识点翻卡</button>
  <button data-tab="quiz">章节自测</button>
  <button data-tab="tools">即用计算器</button>
  <button data-tab="sop">SOP 决策卡</button>
</nav>

<div class="chip-row" id="chipRow"></div>

<section class="tab-panel active" id="tab-cards">
  <p class="flip-tip">点击卡片翻面查看要点；可用上方章节筛选。正面为术语/问题，背面含关键数据与教材出处。</p>
  <div class="card-grid" id="cardGrid"></div>
</section>

<section class="tab-panel" id="tab-quiz">
  <p class="sec-intro">选择章节后开始作答，提交后即时显示对错与解析，套末显示得分与错题回顾。</p>
  <div id="quizControls" style="margin-bottom:14px;">
    <button class="btn" id="quizStart">载入本章自测题</button>
    <button class="btn ghost" id="quizRetry" style="display:none;">重新作答</button>
  </div>
  <div class="score-banner" id="scoreBanner"></div>
  <div id="quizArea"></div>
</section>

<section class="tab-panel" id="tab-tools">
  <div class="subtabs" id="toolTabs"></div>
  <div id="toolArea"></div>
</section>

<section class="tab-panel" id="tab-sop">
  <div class="sop-toolbar no-print">
    <button class="btn" onclick="window.print()">打印 / 另存为 PDF</button>
  </div>
  <div id="sopArea"></div>
</section>

<footer>
  加5磅 Day1 学员工具包（M1–M4）｜ 本工具为教学辅助，所有数据与阈值均源自课程讲义，不替代医学评估与个体化诊疗。
</footer>

</div>

<script>
'use strict';

/* ============ 模块定义 ============ */
const MODULES = [
  {id:0, name:'全部模块'},
  {id:1, name:'M1 生化基础'},
  {id:2, name:'M2 训练营养依据'},
  {id:3, name:'M3 能量与宏量营养素'},
  {id:4, name:'M4 营养评估DAB'}
];
let curModule = 0;

/* ============ 知识点翻卡（44张） ============ */
const FLASHCARDS = [
/* ---- M1 ---- */
{m:1,f:'ATP在肌细胞中的储量特点是什么？',b:'肌细胞内ATP储量极为有限，静息状态下约80-100g分布于全身。ATP水解为ADP和Pi后，必须通过底物水平磷酸化（糖酵解）或氧化磷酸化（线粒体电子传递链）不断再生。ATP再生速率决定运动功率上限，底物来源决定运动持续时间。（M1 §1.0）'},
{m:1,f:'三大营养素在ATP再生中的分工？',b:'碳水化合物：最快速的ATP再生底物，葡萄糖经糖酵解净产2 ATP，有氧氧化产30-32 ATP。脂肪：最高效能量储存形式，1g≈9kcal，主导低中强度供能。蛋白质：正常营养状态下贡献不足总ATP再生的5%，长期饥饿/极量耐力可升至10-15%。（M1 §1.0）'},
{m:1,f:'磷酸原系统的功率、持续时间和典型场景？',b:'底物：ATP+PCr。功率极高（50-70 W/kg）。持续时间5-10秒。典型场景：1-5RM举重、冲刺、抓举。PCr储备量约为ATP的3-4倍。组间需1-3分钟休息恢复PCr。（M1 §1.1.1）'},
{m:1,f:'糖酵解系统的关键限速酶和疲劳机制？',b:'限速酶：PFK-1（磷酸果糖激酶-1），受AMP/ADP激活、ATP和柠檬酸抑制、pH下降抑制。无氧条件下丙酮酸→乳酸+H⁺。疲劳主因：H⁺引起的酸中毒+无机磷酸盐堆积。乳酸非废物，可经Cori循环在肝脏重新转化为葡萄糖。（M1 §1.1.1）'},
{m:1,f:'脂肪-碳水交叉点（Crossover Concept）的含义？',b:'脂肪氧化率达峰值后随强度增加而下降，碳水氧化率持续上升，两条曲线交叉的强度点约在50%-65% VO₂max。低强度(<30% VO₂max)脂肪供能约60-70%但总能耗低；高强度(>65% VO₂max)碳水主导。"低强度=燃脂最优"是片面推论。（M1 §1.1.2, Brooks & Mercier 1994）'},
{m:1,f:'RQ值的判读标准？',b:'呼吸商RQ=VCO₂/VO₂。RQ=1.0→纯碳水氧化；RQ=0.70→纯脂肪氧化；RQ≈0.85→混合底物。间接测热法的方法学误差已由Livesey与Elia系统评估。（M1 §1.1.2）'},
{m:1,f:'mTORC1通路的亮氨酸感应机制？',b:'亮氨酸感受器Sestrin2：亮氨酸缺乏时与GATOR2结合→抑制mTORC1；亮氨酸充足（~20μmol/L）时Sestrin2构象变化→释放GATOR2→RagA/B转GTP结合→mTORC1招募至溶酶体膜→激活。精氨酸感受器CASTOR1以类似机制调控。（M1 §1.2.1）'},
{m:1,f:'亮氨酸触发MPS的阈值及对应蛋白质量？',b:'亮氨酸触发MPS阈值约2-3g/餐，对应约20-40g高质量蛋白质（取决于来源的亮氨酸含量）。Moore等(2015)：运动后0.25-0.4g/kg蛋白质（约20-40g）可最大化MPS。超过此量MPS不再线性增加——"肌肉满载效应"。（M1 §1.2.2）'},
{m:1,f:'Areta 2013实验的关键结论？',b:'12h抗阻训练恢复期，总量80g乳清蛋白分三种模式：8×10g(每1.5h)、4×20g(每3h)、2×40g(每6h)。4×20g模式的MPS总量显著高于另外两种（高31%-48%）。支持"每餐0.4g/kg、每3-5h一餐、日分4-5餐"的分配策略。（M1 §1.2.2）'},
{m:1,f:'AMPK-mTORC1交叉调控的三条关键通路？',b:'①AMPK磷酸化TSC2→增强TSC1/2的GAP活性→促进Rheb-GTP水解→抑制mTORC1。②AMPK磷酸化Raptor(Ser722/Ser792)→直接抑制mTORC1。③AMPK磷酸化ACC(Ser79)→抑制ACC→丙二酰CoA下降→CPT-I去抑制→脂肪酸β-氧化增强。（M1 §1.3.1）'},
{m:1,f:'Wilson 2012与Schumann 2022并发训练meta分析的结论差异？',b:'Wilson 2012(21项研究)：并发训练肌肥大ES=0.85 vs 单纯力量ES=1.23，力量ES=1.44 vs 1.76，干扰显著。Schumann 2022(43项研究)：肌肥大SMD=-0.01（无统计学意义），最大力量SMD=-0.06（无统计学意义），但爆发力SMD=-0.28显著受损。差异源于纳入研究增加、方案设计优化和受试者水平差异。（M1 §1.3.2）'},

/* ---- M2 ---- */
{m:2,f:'训练对能量代谢的急性改变有哪些？',b:'运动中ATP消耗速率可数秒内上升100倍以上。单次抗阻训练消耗肌糖原24%-40%，蛋白质氧化率升高15%-30%。这些急性消耗构成训练后营养恢复的底层需求。（M2 §2.0.1）'},
{m:2,f:'训练营养金字塔四层结构？',b:'第一层（基座）：日常能量平衡与宏量营养素充足。第二层：微量营养素充足。第三层：训练营养策略（前后时机、运动中补给、日/休息日差异化）。第四层（顶端）：膳食补剂。跳过基础直接优化训练营养无意义。（M2 §2.0.3）'},
{m:2,f:'训练前3-4h正餐窗口的推荐？',b:'ACSM/AND/DC 2016联合声明：训练前3-4h摄入碳水1-4g/kg+适量蛋白质的完整正餐。宏量构成以碳水为主、蛋白质适中、脂肪偏低。若已采用4-5餐蛋白分配模式，该正餐通常自然纳入。（M2 §2.1.1）'},
{m:2,f:'运动中碳水补给的分级推荐？',b:'<30min：无需额外碳水（口腔冲洗即可）。30-60min：30g/h。1-3h高强度：60g/h。>2.5h极限耐力：90g/h，须用多种可转运碳水（葡萄糖:果糖=2:1）。多种可转运碳水突破SGLT1单一转运体60g/h吸收上限。（M2 §2.1.2）'},
{m:2,f:'训练后蛋白质的推荐量和时机判断？',b:'0.4-0.55g/kg/餐（Schoenfeld & Aragon 2018）。训练后30min非绝对窗口：当全天蛋白总量充足且训练前已有蛋白质摄入时，紧迫性降低。时机重要的条件：空腹训练、两餐间隔>5h、一日两练间隔<8h、老年合成代谢抵抗、日蛋白<1.4g/kg/d。（M2 §2.1.3）'},
{m:2,f:'训练后液体恢复的推荐？',b:'ACSM建议：训练后液体摄入=体重差值的1.2-1.5倍，多出的20-50%补偿训练后持续尿液丢失。含钠饮料/食物促进液体潴留。单纯大量饮水可恢复血容量但不足以维持（低渗→利尿反射）。（M2 §2.1.3）'},
{m:2,f:'训练日与休息日碳水差异化的推荐？',b:'训练日5-8g/kg（按训练量分档：低容量3-5，中等5-7，高容量6-8）。休息日3-5g/kg。蛋白日总量不变（1.6-2.2g/kg/d），因MPS升高持续24-48h。液体按汗率个体化调整。遵循"为训练供能"（fuel for the work required）原则。（M2 §2.2）'},
{m:2,f:'汗率测量法的操作步骤？',b:'训练前称裸重→训练中记录液体摄入量→训练后再称裸重。体重差值+液体摄入量=总汗量，除以训练时长=平均汗率。用于校准后续训练液体补给计划。个体汗率差异极大（0.3-2.4 L/h）。（M2 §2.1.2）'},

{m:2,f:'训练中蛋白质氧化的比例及影响因素？',b:'训练中蛋白质氧化占总能量消耗的约5-15%，在糖原耗竭或长时间耐力运动中比例升高。支链氨基酸（BCAA）尤其是亮氨酸在运动中被优先氧化。充足糖原储备可减少蛋白质氧化比例。（M2 §2.0.1）'},
{m:2,f:'运动后"合成代谢窗口"的现代理解是什么？',b:'传统"30分钟黄金窗口"被过度夸大。Schoenfeld & Aragon 2013 meta分析表明：当全天蛋白总量充足（≥1.6g/kg/d）且训练前已有进食时，训练后即刻补充并非必要。但在空腹训练、两餐间隔>5h、一日两练间隔<8h等场景下，训练后及时补充（0.4-0.55g/kg蛋白+适量碳水）仍有重要价值。（M2 §2.1.3, §2.3.1）'},
{m:2,f:'什么是"训练日与休息日差异化进食"策略？',b:'训练日提高碳水摄入（5-8g/kg/d），为训练提供充足糖原；休息日适当降低碳水（3-5g/kg/d），增加健康脂肪比例。蛋白质日总量不变（1.6-2.2g/kg/d），因MPS升高持续24-48h。核心原则是"Fuel for the work required"——为训练供能，而非盲目每日相同摄入。（M2 §2.2）'},

/* ---- M3 ---- */
{m:3,f:'TDEE四组分结构及各自占比？',b:'TDEE=RMR+TEF+EAT+NEAT。RMR占60%-80%（最稳定组分，最强预测因子为FFM）。TEF占6%-10%（蛋白质TEF高达20%-30%）。EAT变异性最大（静坐100-300kcal/d，精英耐力4000-8000kcal/d）。NEAT个体差异可达数百kcal/d。（M3 §3.1.1）'},
{m:3,f:'Cunningham 1991与Mifflin-St Jeor 1990公式的选择？',b:'已知FFM首选Cunningham：RMR=21.6×FFM+370，直接以FFM为驱动变量，避免对高肌肉量训练者的系统性低估。无FFM首选Mifflin-St Jeor：男 RMR=10W+6.25H-5A+5；女 RMR=10W+6.25H-5A-161。Mifflin-St Jeor对高FFM训练者可低估100-300kcal/d。（M3 §3.1.2）'},
{m:3,f:'PAL系数的常见陷阱？',b:'高估——教练和训练者倾向高估训练强度和日常活动量，导致TDEE被高估300-500kcal/d。实践建议：从PAL系数表下限起算（如每周4次力量训练取1.6而非1.8），以2-6周体重趋势作为校准锚点。（M3 §3.1.2）'},
{m:3,f:'减脂热量缺口的分层方案？',b:'标准：-300至-500kcal/d，目标每周减重0.25-0.5kg。保守：-200至-300kcal/d，适用于体脂较低（男<15%，女<25%）或训练>3年。激进：-500至-700kcal/d，适用于体脂较高（男>25%，女>35%）初学者前4-6周。缺口越大，蛋白需求越高。（M3 §3.1.3）'},
{m:3,f:'Morton 2018 meta分析的核心发现？',b:'49项RCT、1863名受试者。蛋白质补充对抗阻训练增肌的效应约1.62g/kg/d趋于平台。95%CI为1.4-2.2g/kg/d。剂量-反应：0-1.4区间线性增加，1.4-1.8趋于平缓，>1.8额外收益接近零。这是群体均值平台，不是个体精确目标。（M3 §3.2.2）'},
{m:3,f:'减脂期蛋白质为何上调至2.0-2.4g/kg/d？',b:'能量限制下氨基酸氧化增加、肌肉蛋白质分解加速，需更高外源氨基酸供给维持正氮平衡。体脂越低越接近上限。以目标体重或FFM为计算基准更精确（大体重/高体脂者以FFM计算）。（M3 §3.2.3）'},
{m:3,f:'GI在运动场景下的三个有实操价值的情境？',b:'①训练后0-4h快速糖原再合成期选高GI。②赛前30-60min避免高GI单糖（防反应性低血糖）。③训练前1-4h选低中GI食物作基础供能。日常膳食中过分追求低GI反而可能降低食物多样性。（M3 §3.3.1）'},
{m:3,f:'碳水环化的实操简化方案？',b:'腿/背大肌群日5-7g/kg/d，肩/臂小肌群日4-5g/kg/d，休息日3-4g/kg/d。减脂期训练日4-5g/kg，休息日2.5-3g/kg。无需精确到克，训练日增加主食量、休息日减少主食增加蔬菜和健康脂肪即可。（M3 §3.3.4）'},
{m:3,f:'极低脂饮食对睾酮的影响？',b:'<0.5g/kg/d或<15%TE持续>4周→总睾酮下降10%-15%，游离睾酮下降更显著。机制：胆固醇前体不足+LH脉冲频率下降。男性可出现性欲下降和精液质量变化。女性可加重月经紊乱。（M3 §3.4.3）'},

{m:3,f:'蛋白质每餐分配的最佳模式是什么？',b:'Areta 2013研究证明：等量蛋白质分4餐（每3h一次，每次约20g）比集中在2餐或分散到8餐的MPS反应更优。推荐模式：每餐0.25-0.4g/kg、间隔3-5h、日分4-5餐，确保每餐达到亮氨酸触发阈值（2-3g）。（M3 §3.2.2, M1 §1.2.2）'},
{m:3,f:'为什么"代谢损伤"不是真正的病理实体？',b:'长期能量限制下RMR典型下调5%-15%，是循证可逆的生理适应（适应性产热），而非永久性代谢"损伤"。所谓"代谢损伤"是健身商业化话语，缺乏可靠医学证据支持其为独立病理实体。恢复热量摄入后代谢率可回升。（M3 §3.1.3）'},
{m:3,f:'DIAAS相比PDCAAS的核心优势？',b:'DIAAS(FAO 2013推荐)使用回肠消化率（而非PDCAAS的粪便消化率），以不同年龄段EAA需求为参照，不设上限截断。动物蛋白DIAAS通常>100（优质），植物蛋白多在42-100之间。PDCAAS会截断超过1.0的值，掩盖蛋白质质量差异。（M3 §3.2.4）'},

/* ---- M4 ---- */
{m:4,f:'饮食记录的三个核心问题？',b:'①吃了什么（What）：所有食物饮料，包括零食、补剂、调味品、酒精——最常见遗漏是零食、饮料和烹饪用油。②吃了多少（How Much）：掌心≈80-100g熟肉，一拳≈150-200g熟米饭，一大拇指≈10g油脂。③进食背景（Context）：时间和与训练的时间关系。（M4 §4.1.1）'},
{m:4,f:'Capling 2017关于膳食低报的核心数据？',b:'运动员膳食能量摄入经DLW验证后平均低估19%（Cohen\'s d=-1.006）。个体低估区间约10-30%。低报在高训练量、体重敏感项目和有进食障碍倾向者中更明显。必须与体重变化趋势交叉验证。（M4 §4.1.5）'},
{m:4,f:'EI:BMR比值的低报判定？',b:'Goldberg(1991)建立、Black(2000)验证：EI:BMR<PAL对应阈值时提示低报。使用PAL 1.55单一阈值时，灵敏度约0.50，特异度接近1.00。实操：体重稳定但记录能量低于BMR→低报可能。以非评判方式了解："这份记录和平时比大概打几分？"（M4 §4.1.5）'},
{m:4,f:'BIA体脂率波动的关键局限？',b:'水合状态（饮水量、运动后脱水、月经周期、环境温度）可导致测量值波动2%-5%。不同品牌/型号/电极配置使用不同推算方程，测量结果不可直接对比。教练使用原则：只用于纵向趋势监测——同一设备、同一时间、同一条件，至少间隔4-6周。（M4 §4.2.1）'},
{m:4,f:'FFMI的计算公式和分级标准（男性）？',b:'FFMI=FFM(kg)/身高(m)²；FFM=体重×(1-体脂率)。分级：<17低于平均；17-20平均；20-22高于平均；22-25优秀；25-27自然极限区间；>27疑似药物使用。女性比男性低约4-5个点。注意：FFMI是群体统计指标，不是个体诊断工具。（M4 §4.2.2）'},
{m:4,f:'体成分评估的三大常见陷阱？',b:'①体重数字陷阱：BMI不能区分脂肪和肌肉，180cm/95kg/12%体脂的训练者BMI=29.3（"超重"）但体成分健康。②体脂率波动误判：BIA不同日期波动2%-5%无生理学意义，应以4-6周纵向趋势为准。③围度与体成分脱节：腰围减少1cm≠减了1cm脂肪。（M4 §4.2.3）'},
{m:4,f:'饮食依从性低的主要原因？',b:'几乎从来不是"不够自律"。更多时候是：方案与生活场景不匹配、目标设定过高、缺乏有效的自我监测反馈。评估方法：饮食记录完整度（3天完成≥2天）、自评分数（<7分需了解原因）、体重变化与摄入匹配度、训练表现稳定性。（M4 §4.3.2）'},
{m:4,f:'跨理论模型（TTM）的行为改变五阶段？',b:'①前意向阶段：无改变意愿→提供信息。②意向阶段：意识到问题未行动→探索利弊。③准备阶段：开始尝试→帮助制定第一步。④行动阶段：已执行→强化+处理障碍。⑤维持阶段：>6个月→预防复退。对前意向阶段直接给方案→大概率失败。（M4 §4.3.3）'},
{m:4,f:'身体成分变化的生理学意义判断标准？',b:'体重周均值变化>0.5kg/周提示能量平衡方向改变，具有生理学意义。体脂率单次变化<2%不具生理学意义（在BIA测量误差范围内）。应以4-6周纵向趋势为准，单次数据波动可能由水合状态、饮食等因素导致。（M4 §4.2.3）'},
{m:4,f:'教练在营养评估中的角色边界是什么？',b:'教练角色是"模式识别者"和"行为引导者"，不是"临床诊断者"。能做到：识别饮食模式、发现系统性偏差、提供循证营养教育、行为支持。不能做：诊断进食障碍、开治疗性膳食处方、解读血液生化指标。发现超出执业范围的问题（疑似ED、严重能量不足、生化异常）应及时转介注册营养师或运动医学专业人员。（M4 §4.3.4, 章末小结）'},

// --- Tab切换 ---
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('section.tab-panel').forEach(s=>s.classList.remove('active'));
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  });
});

// --- 章节筛选 ---
const chipRow=document.getElementById('chipRow');
MODULES.forEach(m=>{
  const b=document.createElement('button');
  b.className='chip'+(m.id===0?' active':'');
  b.textContent=m.name;
  b.dataset.mod=m.id;
  b.addEventListener('click',()=>{
    curModule=m.id;
    chipRow.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    b.classList.add('active');
    renderCards(); renderQuiz();
  });
  chipRow.appendChild(b);
});

// --- 翻卡 ---
function renderCards(){
  const grid=document.getElementById('cardGrid');
  grid.innerHTML='';
  const cards=curModule===0?FLASHCARDS:FLASHCARDS.filter(c=>c.m===curModule);
  cards.forEach(c=>{
    const div=document.createElement('div');
    div.className='flip';
    div.innerHTML=`<div class="flip-inner">
      <div class="face front"><div class="fhead"><span class="fch">M${c.m}</span><span class="hint">点击翻转</span></div><div class="ftext">${c.f}</div></div>
      <div class="face back"><div class="fhead"><span class="fch">M${c.m} 解答</span></div><div class="ftext">${c.b}</div></div>
    </div>`;
    div.addEventListener('click',()=>div.classList.toggle('on'));
    grid.appendChild(div);
  });
}
renderCards();

  quizGraded=false;
  scoreBanner.style.display='none';
  const qs=curModule===0?QUIZZES:QUIZZES.filter(q=>q.m===curModule);
  if(!qs.length){quizArea.innerHTML='<p style="color:var(--ink-soft)">该模块暂无自测题。</p>';return;}
  qs.forEach((q,i)=>{
    const card=document.createElement('div');
    card.className='q-card';
    card.dataset.idx=i;
    let optsHtml='';
    const inputType=q.type==='判断'?'radio':'radio';
    q.opts.forEach((o,j)=>{
      optsHtml+=`<label class="q-opt" data-val="${j}"><input type="${inputType}" name="q${i}" value="${j}"> ${o}</label>`;
    });
    card.innerHTML=`<div class="q-title"><span class="qno">${i+1}.</span>[${q.type}] ${q.q}</div>${optsHtml}<div class="q-ex"></div>`;
    quizArea.appendChild(card);
  });
  // 提交按钮
  const submitDiv=document.createElement('div');
  submitDiv.style.marginTop='16px';
  submitDiv.innerHTML='<button class="btn" id="quizSubmit">提交答案</button>';
  quizArea.appendChild(submitDiv);
  document.getElementById('quizSubmit').addEventListener('click',gradeQuiz);
}

function gradeQuiz(){
  if(quizGraded)return;
  quizGraded=true;
  const qs=curModule===0?QUIZZES:QUIZZES.filter(q=>q.m===curModule);
  let correct=0;
  const wrongs=[];
  qs.forEach((q,i)=>{
    const card=quizArea.querySelectorAll('.q-card')[i];
    const sel=card.querySelector('input:checked');
    const val=sel?parseInt(sel.value):-1;
    card.classList.add('graded');
    const opts=card.querySelectorAll('.q-opt');
    if(val===q.ans){
      correct++;
      card.classList.add('right');
      opts[val].classList.add('ok-opt');
    }else{
      card.classList.add('wrong');
      if(val>=0)opts[val].classList.add('bad-opt');
      opts[q.ans].classList.add('ok-opt');
      wrongs.push(i+1);
    }
    card.querySelector('.q-ex').innerHTML=`<b>解析：</b>${q.ex}`;
    const vd=document.createElement('span');
    vd.className='q-verdict '+(val===q.ans?'ok':'no');
    vd.textContent=val===q.ans?'✓ 正确':'✗ 错误';
    card.querySelector('.q-title').appendChild(vd);
  });
  scoreBanner.style.display='block';
  scoreBanner.innerHTML=`<h3>得分：${correct} / ${qs.length}（${Math.round(correct/qs.length*100)}%）</h3>
    <p>${correct===qs.length?'全部正确！':'错题编号：'+wrongs.join('、')}</p>`;
  scoreBanner.scrollIntoView({behavior:'smooth'});
}
renderQuiz();

/* ============ 计算函数 ============ */
function calcBMR(){
  const f=document.getElementById('bmr-formula').value;
  const sex=document.getElementById('bmr-sex').value;
  const w=parseFloat(document.getElementById('bmr-w').value);
  const h=parseFloat(document.getElementById('bmr-h').value);
  const a=parseFloat(document.getElementById('bmr-a').value);
  const bf=parseFloat(document.getElementById('bmr-bf').value);
  const r=document.getElementById('bmr-result');
  if(!w||!h||!a){r.innerHTML='<p style="color:var(--bad)">请填写完整数据</p>';r.classList.add('show');return;}
  let rmr1='',rmr2='',note='';
  // Mifflin
  const msj=sex==='m'?10*w+6.25*h-5*a+5:10*w+6.25*h-5*a-161;
  rmr1=`Mifflin-St Jeor RMR = <b>${Math.round(msj)} kcal/d</b>`;
  if(f==='cun'){
    if(!bf){r.innerHTML='<p style="color:var(--bad)">Cunningham公式需要体脂率</p>';r.classList.add('show');return;}
    const ffm=w*(1-bf/100);
    const cun=21.6*ffm+370;
    rmr2=`<br>Cunningham 1991 RMR = 21.6 × ${ffm.toFixed(1)} + 370 = <b>${Math.round(cun)} kcal/d</b>`;
    note=`<div class="verdict-box yellow"><h4>公式对比</h4>差异：${Math.abs(Math.round(msj)-Math.round(cun))} kcal/d<br>Cunningham直接以FFM为驱动变量，对高肌肉量训练者更准确。<br>Mifflin-St Jeor对高FFM训练者可低估100-300kcal/d。</div>`;
  }
  r.innerHTML=`<p class="big">${Math.round(f==='cun'?(21.6*(w*(1-bf/100))+370):msj)} kcal/d</p>${rmr1}${rmr2}${note}`;
  r.classList.add('show');
}

function calcTDEE(){
  const rmr=parseFloat(document.getElementById('tdee-rmr').value);
  const pal=parseFloat(document.getElementById('tdee-pal').value);
  const r=document.getElementById('tdee-result');
  if(!rmr){r.innerHTML='<p style="color:var(--bad)">请先输入RMR</p>';r.classList.add('show');return;}
  const tdee=rmr*pal;
  r.innerHTML=`<p class="big">${Math.round(tdee)} kcal/d</p>
    <table><tr><th>项目</th><th>数值</th></tr>
    <tr><td>RMR</td><td>${Math.round(rmr)} kcal/d</td></tr>
    <tr><td>PAL系数</td><td>${pal}</td></tr>
    <tr><td>TDEE</td><td><b>${Math.round(tdee)} kcal/d</b></td></tr></table>
    <div class="verdict-box yellow"><h4>校准建议</h4>以此值为起点，记录2-6周体重趋势。若体重持续上升→下调100-200kcal；持续下降→上调100-200kcal。PAL系数建议从下限起算。</div>`;
  r.classList.add('show');
}

function calcMacro(){
  const cal=parseFloat(document.getElementById('macro-cal').value);
  const w=parseFloat(document.getElementById('macro-w').value);
  const pro=parseFloat(document.getElementById('macro-pro').value);
  const fat=parseFloat(document.getElementById('macro-fat').value);
  const r=document.getElementById('macro-result');
  if(!cal||!w){r.innerHTML='<p style="color:var(--bad)">请填写完整数据</p>';r.classList.add('show');return;}
  const proG=pro*w, fatG=fat*w;
  const proCal=proG*4, fatCal=fatG*9;
  const choCal=cal-proCal-fatCal;
  const choG=choCal/4;
  const fatPct=Math.round(fatCal/cal*100);
  const proPct=Math.round(proCal/cal*100);
  const choPct=100-fatPct-proPct;
  let warn='';
  if(fat<0.5*w)warn=`<div class="verdict-box red"><h4>⚠ 脂肪低于激素安全线</h4>脂肪${fat}g/kg/d < 0.5g/kg/d下限。极低脂饮食可导致总睾酮下降10%-15%。</div>`;
  if(choG<0)warn=`<div class="verdict-box red"><h4>⚠ 碳水为负值</h4>蛋白质+脂肪已超出总热量。需重新调整蛋白或脂肪目标。</div>`;
  if(choG<w*3&&choG>0)warn=`<div class="verdict-box yellow"><h4>碳水偏低</h4>${choG.toFixed(0)}g/d（${(choG/w).toFixed(1)}g/kg/d），低于力量训练者实操下限约3g/kg/d。多数训练者报告训练无力和恢复延迟。</div>`;
  r.innerHTML=`<p class="big">碳水 ${choG>0?Math.round(choG):0} g/d</p>
    <table><tr><th>营养素</th><th>克数</th><th>热量</th><th>占比</th></tr>
    <tr><td>蛋白质</td><td>${Math.round(proG)}g</td><td>${Math.round(proCal)}kcal</td><td>${proPct}%</td></tr>
    <tr><td>脂肪</td><td>${Math.round(fatG)}g</td><td>${Math.round(fatCal)}kcal</td><td>${fatPct}%</td></tr>
    <tr><td>碳水</td><td>${choG>0?Math.round(choG):0}g</td><td>${choCal>0?Math.round(choCal):0}kcal</td><td>${choPct>0?choPct:0}%</td></tr>
    <tr style="font-weight:bold"><td>合计</td><td></td><td>${Math.round(proCal+fatCal+(choCal>0?choCal:0))}kcal</td><td>100%</td></tr></table>
    ${warn}<div class="verdict-box green"><h4>分配逻辑</h4>蛋白质优先（设定下限）→ 脂肪保底（≥0.5g/kg/d激素安全线）→ 碳水弹性填充剩余能量。</div>`;
  r.classList.add('show');
}

function calcProtein(){
  const w=parseFloat(document.getElementById('pro-w').value);
  const bf=parseFloat(document.getElementById('pro-bf').value);
  const rate=parseFloat(document.getElementById('pro-scene').value);
  const meals=parseInt(document.getElementById('pro-meals').value);
  const r=document.getElementById('pro-result');
  if(!w){r.innerHTML='<p style="color:var(--bad)">请填写体重</p>';r.classList.add('show');return;}
  let baseW=w;
  let useFFM=false;
  if(bf&&w>90){baseW=w*(1-bf/100);useFFM=true;}
  const total=rate*baseW;
  const perMeal=total/meals;
  const perMealKg=perMeal/w;
  r.innerHTML=`<p class="big">${Math.round(total)} g/d</p>
    <table><tr><th>项目</th><th>数值</th></tr>
    <tr><td>计算基准体重</td><td>${useFFM?`FFM ${baseW.toFixed(1)}kg（体脂${bf}%）`:`${w}kg`}</td></tr>
    <tr><td>推荐量</td><td>${rate}g/kg/d × ${baseW.toFixed(1)}kg = <b>${Math.round(total)}g/d</b></td></tr>
    <tr><td>每餐分配（${meals}餐）</td><td>${Math.round(perMeal)}g/餐（${perMealKg.toFixed(2)}g/kg/餐）</td></tr>
    <tr><td>单餐有效阈值</td><td>0.25-0.4g/kg → 你的区间：${(0.25*w).toFixed(0)}-${(0.4*w).toFixed(0)}g/餐</td></tr></table>
    <div class="verdict-box ${perMeal>40?'yellow':'green'}"><h4>分配检查</h4>${perMeal>=20&&perMeal<=40?
    `每餐${Math.round(perMeal)}g在MPS触发区间（20-40g）${perMeal>40?'，但超过单餐0.55g/kg上限，多余蛋白转向氧化':''}。`
    :perMeal<20?`每餐${Math.round(perMeal)}g低于MPS触发阈值20g，需增加每餐蛋白量或减少餐次。`:`每餐${Math.round(perMeal)}g在合理范围内。`}</div>`;
  r.classList.add('show');
}

function calcNavy(){
  const sex=document.getElementById('navy-sex').value;
  const h=parseFloat(document.getElementById('navy-h').value);
  const waist=parseFloat(document.getElementById('navy-waist').value);
  const neck=parseFloat(document.getElementById('navy-neck').value);
  const r=document.getElementById('navy-result');
  if(!h||!waist||!neck){r.innerHTML='<p style="color:var(--bad)">请填写完整数据</p>';r.classList.add('show');return;}
  let bf;
  if(sex==='m'){
    bf=86.010*Math.log10(waist-neck)-70.041*Math.log10(h)+36.76;
  }else{
    const hip=parseFloat(document.getElementById('navy-hip').value);
    if(!hip){r.innerHTML='<p style="color:var(--bad)">女性需要臀围数据</p>';r.classList.add('show');return;}
    bf=163.205*Math.log10(waist+hip-neck)-355.055*Math.log10(h)+74.595;
  }
  bf=Math.max(bf,5);
  const w=75;// placeholder
  let verdict='';
  if(sex==='m'){
    if(bf<6)verdict='red';else if(bf<14)verdict='green';else if(bf<18)verdict='green';else if(bf<25)verdict='yellow';else verdict='red';
  }else{
    if(bf<14)verdict='red';else if(bf<21)verdict='green';else if(bf<25)verdict='green';else if(bf<32)verdict='yellow';else verdict='red';
  }
  r.innerHTML=`<p class="big">${bf.toFixed(1)}%</p>
    <div class="verdict-box ${verdict}"><h4>体脂率分级${sex==='m'?'（男性）':'（女性）'}</h4>
    ${sex==='m'?'< 6% 极低（竞技状态） | 6-14% 精瘦 | 15-18% 健康 | 19-25% 偏高 | >25% 肥胖':'<14% 极低 | 14-21% 精瘦 | 22-25% 健康 | 26-32% 偏高 | >32% 肥胖'}</div>
    <div class="disclaimer">Navy法为估算方法，受测量技术影响大。BIA体脂率因水合状态可波动2-5%。仅用于纵向趋势监测。</div>`;
  r.classList.add('show');
}

function calcFFMI(){
  const w=parseFloat(document.getElementById('ffmi-w').value);
  const h=parseFloat(document.getElementById('ffmi-h').value)/100;
  const bf=parseFloat(document.getElementById('ffmi-bf').value)/100;
  const r=document.getElementById('ffmi-result');
  if(!w||!h||!bf){r.innerHTML='<p style="color:var(--bad)">请填写完整数据</p>';r.classList.add('show');return;}
  const ffm=w*(1-bf);
  const ffmi=ffm/(h*h);
  const nffmi=ffmi+6.1*(1.80-h);
  let grade='',cls='';
  if(nffmi<17){grade='低于平均';cls='red';}
  else if(nffmi<20){grade='平均';cls='yellow';}
  else if(nffmi<22){grade='高于平均';cls='green';}
  else if(nffmi<25){grade='优秀';cls='green';}
  else if(nffmi<27){grade='自然极限区间';cls='yellow';}
  else{grade='>25：需结合其他生化证据';cls='red';}
  r.innerHTML=`<p class="big">FFMI ${ffmi.toFixed(1)} ｜ 标准化 ${nffmi.toFixed(1)}</p>
    <table><tr><th>项目</th><th>数值</th></tr>
    <tr><td>FFM</td><td>${ffm.toFixed(1)}kg</td></tr>
    <tr><td>FFMI</td><td>${ffmi.toFixed(2)} kg/m²</td></tr>
    <tr><td>标准化FFMI</td><td>${nffmi.toFixed(2)} kg/m²</td></tr></table>
    <div class="verdict-box ${cls}"><h4>分级（男性）</h4>
    &lt;17 低于平均 | 17-20 平均 | 20-22 高于平均 | 22-25 优秀 | 25-27 自然极限 | &gt;27 需结合其他证据<br>
    <b>当前判定：${grade}</b></div>
    <div class="disclaimer">FFMI是群体统计指标，非个体诊断工具。Kouri 1995非使用者样本仅74人，不足以定义人类肌肉量绝对上限。BIA体脂率误差可导致FFMI偏差±1-2个点。</div>`;
  r.classList.add('show');
}

function calcDeficit(){
  const tdee=parseFloat(document.getElementById('def-tdee').value);
  const goal=parseFloat(document.getElementById('def-goal').value);
  const w=parseFloat(document.getElementById('def-w').value);
  const r=document.getElementById('def-result');
  if(!tdee){r.innerHTML='<p style="color:var(--bad)">请输入TDEE</p>';r.classList.add('show');return;}
  const target=tdee+goal;
  const weekly=Math.abs(goal)*7;
  const kgWeek=weekly/7700;
  let label=goal<0?'减脂':'增肌';
  if(goal===0)label='维持';
  r.innerHTML=`<p class="big">${Math.round(target)} kcal/d</p>
    <table><tr><th>项目</th><th>数值</th></tr>
    <tr><td>TDEE</td><td>${Math.round(tdee)} kcal/d</td></tr>
    <tr><td>${label}调整</td><td>${goal>0?'+':''}${goal} kcal/d</td></tr>
    <tr><td>目标热量</td><td><b>${Math.round(target)} kcal/d</b></td></tr>
    <tr><td>预计每周体重变化</td><td>${goal!==0?(goal<0?'-':'+'+kgWeek.toFixed(2))+'kg/周':'—'}</td></tr></table>
    ${goal<-500?`<div class="verdict-box red"><h4>缺口偏大</h4>每日${Math.abs(goal)}kcal缺口超过标准方案（-300至-500kcal/d）。建议保守方案（-200至-300kcal/d），蛋白质上调至2.0-2.4g/kg/d。</div>`:''}
    ${goal>300?`<div class="verdict-box yellow"><h4>盈余偏大</h4>+${goal}kcal/d超出干净增肌推荐（+200至+300kcal/d）。脏增肌额外增重中脂肪占比显著升高。</div>`:''}
    <div class="verdict-box green"><h4>Pontzer约束TEE模型提醒</h4>运动能量补偿平均约39%（CV 116%），即每100kcal运动消耗中约39kcal被机体在其他组分中"节省"回来。不可假设运动=净消耗。以2-6周体重趋势校准。</div>`;
  r.classList.add('show');
}

function calcFluid(){
  const pre=parseFloat(document.getElementById('fl-pre').value);
  const post=parseFloat(document.getElementById('fl-post').value);
  const drink=parseFloat(document.getElementById('fl-drink').value)||0;
  const dur=parseFloat(document.getElementById('fl-dur').value)||1;
  const r=document.getElementById('fl-result');
  if(!pre||!post){r.innerHTML='<p style="color:var(--bad)">请填写体重数据</p>';r.classList.add('show');return;}
  const loss=pre-post+drink;
  const sweatRate=loss/dur;
  const rehyLo=loss*1.2;
  const rehyHi=loss*1.5;
  r.innerHTML=`<p class="big">补液 ${rehyLo.toFixed(1)} - ${rehyHi.toFixed(1)} L</p>
    <table><tr><th>项目</th><th>数值</th></tr>
    <tr><td>体重损失</td><td>${(pre-post).toFixed(1)}kg</td></tr>
    <tr><td>训练中饮水</td><td>${drink}L</td></tr>
    <tr><td>总汗量</td><td><b>${loss.toFixed(2)}L</b></td></tr>
    <tr><td>平均汗率</td><td>${sweatRate.toFixed(2)}L/h</td></tr>
    <tr><td>推荐补液量（1.2-1.5倍）</td><td><b>${rehyLo.toFixed(1)}-${rehyHi.toFixed(1)}L</b></td></tr></table>
    ${sweatRate>1.5?`<div class="verdict-box yellow"><h4>汗率偏高</h4>${sweatRate.toFixed(2)}L/h超过常见范围。注意电解质补充，运动饮料钠浓度建议200-500mg/L。</div>`:''}
    <div class="verdict-box green"><h4>补液策略</h4>在训练后2-6小时内分次摄入。含钠饮料/食物促进液体潴留。单纯大量饮水可恢复血容量但不足以维持（低渗→利尿反射）。</div>`;
  r.classList.add('show');
}

function calcGlyco(){
  const type=document.getElementById('gc-type').value;
  const dur=parseFloat(document.getElementById('gc-dur').value);
  const int=document.getElementById('gc-int').value;
  const r=document.getElementById('gc-result');
  if(!dur){r.innerHTML='<p style="color:var(--bad)">请填写训练时长</p>';r.classList.add('show');return;}
  let rec='',reason='',detail='';
  if(dur<30){
    rec='无需额外碳水';
    reason='训练时间<30分钟，糖原消耗有限。口腔冲洗碳水可产生轻微收益。';
  }else if(dur<=60){
    if(type==='strength'||int==='low'){
      rec='通常不需要运动中补碳';
      reason='60分钟以内常规力量训练糖原消耗在总储备中占比有限，纯水即可。';
    }else{
      rec='30g/h 碳水';
      reason='中等时长高强度训练，适量碳水可维护训练输出质量。';
    }
  }else if(dur<=180){
    rec='30-60g/h 碳水';
    reason=`${dur}分钟${type==='endurance'?'耐力训练':'高强度训练'}，糖原消耗显著。多种可转运碳水（葡萄糖:果糖=2:1）可突破60g/h吸收上限。`;
    if(type==='strength'&&dur>90)detail='高容量腿部训练>90分钟，建议训练中补碳30-40g/h。';
  }else{
    rec='60-90g/h 碳水（多种可转运碳水）';
    reason='超过3小时必须使用多种可转运碳水（葡萄糖:果糖=2:1）突破SGLT1单一转运体60g/h饱和上限。';
  }
  r.innerHTML=`<p class="big">${rec}</p>
    <div class="verdict-box ${dur>90?'yellow':'green'}"><h4>推荐</h4>${rec}<br><br>${reason}</div>
    ${detail?`<div class="sop-note">${detail}</div>`:''}
    <table><tr><th>训练时长</th><th>碳水推荐</th><th>说明</th></tr>
    <tr><td><30min</td><td>无需 / 口腔冲洗</td><td>糖原消耗极有限</td></tr>
    <tr><td>30-60min</td><td>30g/h</td><td>常规力量训练通常不需要</td></tr>
    <tr><td>1-3h</td><td>60g/h</td><td>高容量训练/一日两练</td></tr>
    <tr><td>>2.5h</td><td>90g/h</td><td>必须多种可转运碳水</td></tr></table>`;
  r.classList.add('show');
}

// --- SOP决策卡 ---
function renderSOP(){
  const area=document.getElementById('sopArea');
  area.innerHTML='';
  SOP_CARDS.forEach(c=>{
    const div=document.createElement('div');
    div.className='sop-card';
    div.innerHTML=`<h3>${c.title}</h3>${c.content}`;
    area.appendChild(div);
  });
}
renderSOP();
