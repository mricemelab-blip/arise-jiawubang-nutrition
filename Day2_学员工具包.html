<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加5磅 Day2 学员工具包（M5–M8）</title>
<style>
:root{
  --paper:#ffffff;--bg:#f5f5f0;--ink:#1a1a1a;--ink-soft:#5a5a5a;
  --brand:#1a2332;--accent:#c9a84c;--line:#e8e4dc;
  --ok:#1a3a2a;--warn:#8a6d1b;--bad:#8a2a2a;
  --gold-soft:#f7f1e3;--brand-soft:#e8ecf0;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;font-size:15.5px;line-height:1.75;}
h1,h2,h3,h4,.sans,nav,button,label,.tag,.chip,.q-opt{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;}
header{background:var(--paper);border-bottom:3px solid var(--accent);padding:26px 20px 18px;text-align:center;}
header h1{margin:0 0 6px;font-size:24px;color:var(--brand);letter-spacing:2px;font-weight:700;}
header .sub{color:var(--ink-soft);font-size:13.5px;line-height:1.7;}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px 60px;}
nav.tabs{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;flex-wrap:wrap;gap:6px;padding:14px 0 10px;border-bottom:1px solid var(--line);}
nav.tabs button{border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);padding:8px 18px;border-radius:999px;font-size:15px;cursor:pointer;transition:all .2s ease;}
nav.tabs button:hover{border-color:var(--accent);color:var(--brand);background:#faf8f3;}
nav.tabs button.active{background:linear-gradient(135deg,var(--brand) 0%,#243044 100%);border-color:var(--brand);color:#fff;box-shadow:0 2px 6px rgba(26,35,50,.18);}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0 4px;}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink-soft);padding:4px 14px;border-radius:999px;font-size:13px;cursor:pointer;}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
section.tab-panel{display:none;padding-top:18px;}
section.tab-panel.active{display:block;}
.sec-intro{color:var(--ink-soft);font-size:14px;margin:6px 0 14px;}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:4px;background:var(--brand-soft);color:var(--brand);border:1px solid #cdd5de;margin-right:6px;}
.tag.gold{background:var(--gold-soft);color:#7a5c10;border-color:#e4d9b8;}
.tag.redtag{background:#fbeaea;color:var(--bad);border-color:#e3c6c6;}

/* 翻卡 */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:16px;}
.flip{perspective:1200px;height:230px;cursor:pointer;}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d;}
.flip.on .flip-inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:16px 16px 14px;overflow:auto;box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.06);}
.face.back{transform:rotateY(180deg);background:#eee9dd;border-color:#d8d0be;}
.face .fhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.face .fch{font-size:12px;color:var(--brand);font-family:"PingFang SC",sans-serif;}
.face .hint{font-size:11.5px;color:var(--ink-soft);font-family:"PingFang SC",sans-serif;}
.face .ftext{font-size:15px;}
.face.back .ftext{font-size:13.8px;color:#2a2820;}
.flip-tip{font-size:13px;color:var(--ink-soft);margin:0 0 12px;}

/* 自测 */
.q-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px;}
.q-card.right{border-color:#a8c5b8;background:#f2f7f4;}
.q-card.wrong{border-color:#dfb9b9;background:#fbf3f3;}
.q-title{font-weight:bold;margin-bottom:10px;font-family:"PingFang SC",sans-serif;font-size:15px;}
.q-title .qno{color:var(--brand);margin-right:6px;}
.q-opt{display:block;padding:5px 10px;margin:4px 0;border-radius:6px;cursor:pointer;font-size:14.5px;}
.q-opt:hover{background:#f5f0e3;}
.q-opt input{margin-right:8px;}
.q-opt.ok-opt{background:#e2ede7;color:#1a3a2a;font-weight:bold;}
.q-opt.bad-opt{background:#f3e0e0;color:#8a3333;}
.q-ex{display:none;margin-top:10px;padding:10px 12px;border-left:3px solid var(--accent);background:#faf6ec;font-size:13.5px;color:#3a362c;border-radius:0 6px 6px 0;}
.q-card.graded .q-ex{display:block;}
.q-verdict{font-family:"PingFang SC",sans-serif;font-size:13px;font-weight:bold;margin-left:8px;}
.q-verdict.ok{color:var(--ok);}.q-verdict.no{color:var(--bad);}
.btn{font-family:"PingFang SC",sans-serif;font-size:15px;cursor:pointer;border:1px solid var(--brand);background:linear-gradient(135deg,var(--brand) 0%,#243044 100%);color:#fff;padding:9px 26px;border-radius:8px;margin:6px 8px 6px 0;transition:all .2s ease;box-shadow:0 1px 3px rgba(26,35,50,.10);}
.btn:hover{box-shadow:0 3px 10px rgba(26,35,50,.18);transform:translateY(-1px);}
.btn.ghost{background:transparent;color:var(--brand);border-color:var(--brand);}
.btn.ghost:hover{background:var(--brand-soft);}
.score-banner{display:none;background:var(--paper);border:2px solid var(--accent);border-radius:10px;padding:18px 22px;margin:16px 0;text-align:center;}
.score-banner h3{margin:0 0 6px;color:var(--brand);}

/* 计算器 */
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 18px;}
.subtabs button{font-family:"PingFang SC",sans-serif;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);padding:7px 16px;border-radius:8px;}
.subtabs button.active{background:linear-gradient(135deg,var(--accent) 0%,#b89530 100%);border-color:var(--accent);color:#fff;box-shadow:0 2px 6px rgba(201,168,76,.22);}
.tool-panel{display:none;}.tool-panel.active{display:block;}
.tool-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px 22px;max-width:860px;margin:0 auto;box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.06);}
.tool-card h3{margin:0 0 4px;color:var(--brand);font-size:18px;}
.tool-card .formula{font-size:13.5px;color:var(--ink-soft);background:var(--gold-soft);border-radius:6px;padding:8px 12px;margin:10px 0;font-family:"PingFang SC",sans-serif;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 18px;margin:14px 0;}
.field{display:flex;flex-direction:column;font-family:"PingFang SC",sans-serif;font-size:13.5px;}
.field label{color:var(--ink-soft);margin-bottom:3px;}
.field input,.field select{padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:15px;background:#fff;color:var(--ink);font-family:inherit;}
.result{display:none;margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;}.result.show{display:block;}
.result .big{font-family:"PingFang SC",sans-serif;font-size:26px;font-weight:bold;color:var(--brand);}
.verdict-box{border-radius:8px;padding:12px 16px;margin:12px 0;font-size:14.5px;font-family:"PingFang SC",sans-serif;}
.verdict-box.green{background:#e6f0ea;border:1px solid #a8c5b8;color:#1a3a2a;}
.verdict-box.yellow{background:var(--gold-soft);border:1px solid #ddd0a8;color:#6a4e10;}
.verdict-box.red{background:#f8e8e8;border:1px solid #dfb9b9;color:#8a3333;}
.verdict-box h4{margin:0 0 6px;font-size:16px;}
.result table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0;}
.result th,.result td{border:1px solid var(--line);padding:6px 9px;text-align:left;}
.result th{background:var(--brand);color:#fff;font-family:"PingFang SC",sans-serif;font-weight:600;}
.disclaimer{margin-top:18px;font-size:12.8px;color:var(--ink-soft);background:#faf8f2;border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-family:"PingFang SC",sans-serif;}

/* SOP决策卡 */
.sop-sheet{background:#fff;border:1px solid var(--line);border-radius:8px;max-width:210mm;margin:0 auto 26px;padding:26px 30px;box-shadow:0 1px 3px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.07);}
.sop-sheet h3{color:var(--brand);border-bottom:2px solid var(--accent);padding-bottom:8px;margin:0 0 6px;font-size:19px;}
.sop-sheet h4{font-size:15px;color:var(--accent);margin:16px 0 6px;}
.sop-sheet table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0;}
.sop-sheet th,.sop-sheet td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;}
.sop-sheet th{background:var(--brand);color:#fff;font-family:"PingFang SC",sans-serif;font-weight:600;}
.flow-box{border:1px dashed var(--accent);border-radius:8px;padding:10px 14px;margin:8px 0;background:#faf8f2;font-size:13.5px;}
.flow-step{font-family:"PingFang SC",sans-serif;font-weight:bold;color:var(--brand);}
.sop-note{font-size:12.5px;color:var(--ink-soft);background:#faf6ec;border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 6px 6px 0;margin-top:12px;}
.redline{color:var(--bad);font-weight:bold;}
.sop-toolbar{text-align:center;margin:10px 0 18px;}

footer{text-align:center;color:var(--ink-soft);font-size:12.5px;padding:24px 0 10px;border-top:1px solid var(--line);margin-top:30px;font-family:"PingFang SC",sans-serif;}
@media print{
  header,nav.tabs,.chip-row,.sop-toolbar,footer,.no-print{display:none!important;}
  body{background:#fff;}
  section.tab-panel{display:none!important;}
  #tab-sop{display:block!important;}
  .sop-sheet{box-shadow:none;border:1px solid #999;page-break-after:always;max-width:100%;}
}
</style>
</head>
<body>
<header>
  <h1>加5磅 · Day2 学员互动工具包</h1>
  <div class="sub">覆盖模块 M5 维生素矿物质与水 · M6 补剂决策框架 · M7 首次咨询SOP与行为改变 · M8 减脂方案专题<br>全部数据与阈值取自教材原文，无外部编造</div>
</header>
<div class="wrap">

<nav class="tabs">
  <button data-tab="cards" class="active">知识点翻卡</button>
  <button data-tab="quiz">章节自测</button>
  <button data-tab="tools">即用计算器</button>
  <button data-tab="sop">SOP 决策卡</button>
</nav>

<div class="chip-row" id="chipRow"></div>

<section class="tab-panel active" id="tab-cards">
  <p class="flip-tip">点击卡片翻面查看要点；可用上方模块筛选。正面为术语/问题，背面含英文全称、关键数字与教材出处。</p>
  <div class="card-grid" id="cardGrid"></div>
</section>

<section class="tab-panel" id="tab-quiz">
  <p class="sec-intro">选择模块后开始作答，提交后即时显示对错与解析。套末显示得分与错题回顾。</p>
  <div id="quizControls" style="margin-bottom:14px;">
    <button class="btn" id="quizStart">载入本模块自测题</button>
    <button class="btn ghost" id="quizRetry" style="display:none;">重新作答</button>
  </div>
  <div class="score-banner" id="scoreBanner"></div>
  <div id="quizArea"></div>
</section>

<section class="tab-panel" id="tab-tools">
  <div class="subtabs" id="toolTabs">
    <button data-tool="vd" class="active">维生素D剂量换算</button>
    <button data-tool="iron">铁缺乏分期判断</button>
    <button data-tool="hydro">水合状态评估</button>
    <button data-tool="supp">补剂优先级排序</button>
    <button data-tool="reds">RED-S风险筛查</button>
    <button data-tool="deficit">减脂热量缺口</button>
    <button data-tool="macro">宏量营养素分配</button>
    <button data-tool="bfpred">体脂变化预测</button>
  </div>
  <div id="toolArea"></div>
</section>

<section class="tab-panel" id="tab-sop">
  <div class="sop-toolbar no-print">
    <button class="btn" onclick="window.print()">打印 / 另存为 PDF（A4）</button>
  </div>
  <div id="sopArea"></div>
</section>

<footer>
  加5磅 Day2 学员工具包（M5–M8）｜ 本工具为教学辅助，不替代医学评估与个体化诊疗；出现红旗信号须按教材流程转介。
</footer>

</div>

<script>
'use strict';
/* ============ 模块定义 ============ */
const MODULES = [
  {id:0,name:'全部模块'},
  {id:5,name:'M5 维生素矿物质与水'},
  {id:6,name:'M6 补剂决策框架'},
  {id:7,name:'M7 首次咨询SOP'},
  {id:8,name:'M8 减脂方案专题'}
];
let curMod = 0;

/* ============ 翻卡数据 ============ */
const FLASHCARDS = [
/* M5 - 12张 */
{m:5,f:'微量营养素与宏量营养素的根本区分是什么？',b:'宏量营养素（蛋白质、碳水、脂肪）以克级摄入量提供能量和组织构建原料。微量营养素（维生素、矿物质）在mg/μg级摄入，不提供能量，不构成组织结构主体，角色是酶促反应的催化剂。"参与能量代谢"≠"提供能量"，这是训练者群体中最普遍的认知错误。（§5.0.1）'},
{m:5,f:'维生素D状态评估的金标准与阈值争议？',b:'血清25(OH)D为金标准。Holick以<50 nmol/L为缺乏，Endocrine Society以75 nmol/L为充足，两者相差25 nmol/L，直接影响同一训练者的判断结论。2011 IOM基于骨骼健康数据将50 nmol/L作为大多数人群充足阈值。（§5.1.1）'},
{m:5,f:'镁与ATP的关系？运动对镁需求的影响？',b:'ATP在细胞内必须以Mg-ATP复合物形式发挥功能。超300种酶促反应需镁作为辅因子，包括肌球蛋白ATP酶、SERCA和Na⁺/K⁺-ATP酶。运动训练可能使镁需求增加10%–20%（Nielsen & Lukaski），运动日尿镁排泄可比休息日增加约22%。（§5.1.2）'},
{m:5,f:'铁缺乏三阶段分期模型？',b:'第一阶段：储铁耗竭，SF<12–30 μg/L，Hb正常；第二阶段：早期功能性铁缺乏，TSAT<16%，sTfR>8.5 mg/L，Hb正常或临界；第三阶段：缺铁性贫血，男性Hb<130 g/L，女性Hb<120 g/L，MCV<80 fL。真正威胁在第一、二阶段。（§5.4.1）'},
{m:5,f:'hepcidin在铁代谢中的核心调控机制？',b:'hepcidin由肝脏分泌，与肠上皮细胞和巨噬细胞的ferroportin结合并导致其内吞降解，阻断肠道铁吸收和储存铁释放。运动后3–6小时hepcidin可升高至安静时的4–27倍，约24小时回归基线。高训练量训练者的铁吸收效率系统性偏低。（§5.4.3）'},
{m:5,f:'脱水对运动表现的定量影响（ACSM 2007）？',b:'脱水>2% BW可降低有氧运动表现（热环境中证据等级A）；脱水程度越大，生理张力和有氧表现下降越严重（A级）；脱水>2% BW可降低心理/认知表现（B级）；脱水3%–5% BW不降低无氧运动表现或肌肉力量（A/B级）。（§5.3.1）'},
{m:5,f:'汗液丢失量与汗率计算公式？',b:'汗液丢失量(mL) = (W_pre - W_post)×1000 + V_drink - V_urine。汗率(L/h) = 汗液丢失量(mL) ÷ 训练时长(h)。%BW损失 = (W_pre - W_post) ÷ W_pre × 100%。连续测量3–5次不同条件取均值。（§5.3.3）'},
{m:5,f:'训练后补液的核心原则？',b:'摄入量应大于体重损失量。推荐比例为每丢失1 kg体重摄入1.25–1.5 L液体（含适量钠盐）。恢复饮料推荐钠含量约50–90 mmol/L。Maughan & Leiper 1995证实：无钠组6小时后仍有约800 mL净负液体平衡。（§5.3.5）'},
{m:5,f:'Ristow等2009年PNAS研究的核心发现？',b:'补充维生素C 1000 mg/d + 维生素E 400 IU/d完全阻断了运动诱导的胰岛素敏感性改善和PGC-1α、PGC-1β、PPARγ表达上调。内源性抗氧化防御酶（SOD1、SOD2、GPx1）的运动诱导上调同样被抑制。高剂量抗氧化补剂可能干扰训练适应。（§5.1.5）'},
{m:5,f:'铁蛋白（SF）作为急性期反应物的解读陷阱？',b:'感染、炎症、近期高强度训练均可使SF假性抬高。单独检测SF不结合CRP可能导致错误的充足判断。实验室筛查最低组合：CBC、Hb、MCV、MCH、SF、TSAT和CRP。训练者实践阈值：SF<30 μg/L为警惕阈值，<15 μg/L为转介阈值。（§5.2.5）'},
{m:5,f:'运动相关低钠血症（EAH）的核心鉴别？',b:'EAH定义为运动中或运动后24小时内血钠<135 mmol/L。核心机制：过量低渗液体摄入 + 非渗透性ADH分泌。最实用的单一鉴别指标是体重变化方向：脱水时体重减轻，EAH时体重增加或不变。步态失调是EAH区别于脱水的最特征性早期神经学体征。（§5.3.6）'},
{m:5,f:'ZMA循证分析的核心结论？',b:'Brilla & Conte 2000报告ZMA组力量提升，但Victor Conte是ZMA专利持有者（教科书级COI）。Wilborn等2004独立双盲RCT（n=28，8周）显示ZMA与安慰剂组在睾酮、力量、体成分上均无显著差异。受试者基线锌浓度处于正常范围上限——"解决了一个并不存在的问题"。（§5.1.4）'},

/* M6 - 10张 */
{m:6,f:'AIS ABCD分类系统的四级定义？',b:'Group A：有强科学证据支持、特定运动场景有明确使用方案。Group B：有新兴科学支持但需进一步研究。Group C：科学证据不支持或尚不足以形成知情判断。Group D：含WADA禁用物质或高污染风险。分类针对成分而非品牌，随新证据更新。（§6.1.1）'},
{m:6,f:'IOC 2018共识声明对补剂的核心判断？',b:'营养通常对运动表现做出小但有价值的贡献，膳食补剂只能在这一营养计划中做出次要贡献。当基础膳食和训练营养策略尚未优化时，补剂的边际收益接近于零。营养金字塔基座是基础膳食，顶端才是补剂。（§6.0.3）'},
{m:6,f:'一水肌酸的剂量方案与安全性？',b:'加载期20 g/d分4次×5–7天；维持期3–5 g/d单次。可跳过加载直接3–5 g/d，约28天达饱和。ISSN确认对健康人群长期使用安全（>20年随访无严重不良反应）。约20%–30%为"非响应者"，与基线肌内肌酸水平较高有关。（§6.2.1）'},
{m:6,f:'咖啡因的CYP1A2基因多态性影响？',b:'CYP1A2将人群分为快代谢（AA）、中等（AC）和慢代谢（CC）者。慢代谢者约占10%–15%，半衰期延长至8–10小时，可能对咖啡因无效甚至产生负效应。不习惯者应从1–2 mg/kg开始测试耐受性。（§6.2.2）'},
{m:6,f:'β-丙氨酸的剂量与起效模式？',b:'4–6 g/d（约65 mg/kg/d），分次摄入（每3–4小时0.8–1.6 g），随餐。需持续10–12周。肌肽浓度升高在4周后可测，10–12周达平台。主要副作用为感觉异常（皮肤刺痒），分次小剂量可显著缓解。（§6.2.3）'},
{m:6,f:'BCAA在证据链三要素审视下的结论？',b:'机制：亮氨酸确实激活mTORC1，但BCAA缺乏EAA底物无法独立支持最大MPS。人体RCT：蛋白摄入充足（≥1.6 g/kg/d）时，额外BCAA对MPS和瘦体重贡献接近零。AIS归为Group C。结论：总蛋白达标时BCAA无额外增肌效益。（§6.3.1）'},
{m:6,f:'补剂污染风险的核心数据？',b:'Geyer等2004 IOC资助研究：634个非激素类补剂中14.8%含未声明合成代谢类固醇前体。Martínez-Sanz等2017系统综述：3132个样品中27.9%含未声明物质。第三方批次检测认证（Informed Sport、NSF Certified for Sport）是最有效风险降低手段。（§6.4.1）'},
{m:6,f:'WADA严格责任原则的含义？',b:'运动员对其体内出现的任何禁用物质承担全部责任，无论有意摄入还是无意污染。"我不知道补剂被污染"不是有效抗辩。教练不得推荐未经第三方检测认证的补剂，这是执业红线。（§6.4.3）'},
{m:6,f:'Group A不等于"无条件推荐"的三层含义？',b:'①运动食品的使用前提是确实存在便利营养需求而非替代正餐；②医用补剂必须在实验室检测确认缺乏后使用；③性能补剂需匹配具体运动场景和目标，且应在基础营养优化后考虑。IOC/AIS/WADA三者协同构成决策框架。（§6.1.2）'},
{m:6,f:'硝酸盐补剂的关键使用细节？',b:'6–8 mmol NO₃⁻运动前2–2.5小时摄入。甜菜根汁浓缩液（约70 ml shot）是常用剂型。关键细节：使用抗菌漱口水可杀灭口腔硝酸盐还原菌，完全消除增效作用。训练日使用抗菌漱口水将使硝酸盐补剂完全失效。（§6.2.4）'},

/* M7 - 10张 */
{m:7,f:'首次咨询60分钟标准流程的六段划分？',b:'破冰与知情同意(0–5min)→目标设定与红线筛查(5–15min)→评估数据采集(15–30min)→方案框架讲解(30–45min)→答疑与签约(45–55min)→后续安排(55–60min)。红线筛查优先于详细问诊。（§7.1）'},
{m:7,f:'红线7类判据包括哪些？',b:'①饮食障碍倾向（BMI<17.5、极端体脂目标、催吐/泻药史）；②急性期/重症慢病；③孕产期高危；④儿童年龄红线（<6岁）；⑤单一复杂用药（华法林等）；⑥心理障碍并发（PHQ-9≥15/GAD-7≥15）；⑦老年多重用药综合征（≥65岁+用药≥5种）。任一项阳性即触发转介。（§7.1.2）'},
{m:7,f:'COM-B模型的三个核心变量？',b:'Capability（能力）：知识或技能缺失。Opportunity（机会）：环境因素阻碍。Motivation（动机）：意愿不足或被压制。三者同时具备行为才可能持续。三格轻量版将反思性动机与自动性动机合并为M格。（§7.2.2）'},
{m:7,f:'BCTTv1的93项技术如何聚类？',b:'按相似性聚类为16组。健身咨询场景高频使用约20项，覆盖80%以上日常操作。BCT 1.1行为目标设定、BCT 4.1操作指导、BCT 12.1环境重构、BCT 6.1行为示范等为高频技术。（§7.2.2）'},
{m:7,f:'SCOFF进食障碍筛查的判定标准？',b:'SCOFF 5项筛查问卷。≥2分触发红线1转介流程，停止本咨询，转介精神科+临床营养科。（§7.1.2）'},
{m:7,f:'TTM五阶段的关键警示？',b:'阶段不是单向递进的。来访者可能在Action与Contemplation之间反复摆动。对前意向阶段来访者派发行动计划属于阶段错配。首诊5分钟内完成阶段判定。（§7.2.3）'},
{m:7,f:'SNC/RD/医师的执业范围划分？',b:'SNC：面向健康人群与慢病稳定期，可制定膳食/运动营养方案，不可做MNT。RD：可进入疾病状态营养支持，独立执行NCP，唯一有权做PES营养诊断。医师：拥有医学诊断权、处方权和药物调整权。（§7.3.1）'},
{m:7,f:'EPE框架的三步流程？',b:'Elicitation（引出）→ Provide（提供）→ Elicitation（引出）。先引出已有认知，再提供循证信息，最后引出新信息的理解与整合。确保信息交付是协作式而非灌输式。（§7.2.1）'},
{m:7,f:'灰色地带三问决策SOP？',b:'Q1：医学状态是否已由医师确认稳定？Q2：拟实施方案是否影响在用药物的效果或安全性？Q3：来访者目标在当前医学状态下是否安全可行？三问中任一不满足即转介或调整方案。（§7.3.2）'},
{m:7,f:'首次咨询为什么不输出完整饮食方案？',b:'方案制定需等待3日饮食记录收齐（2训练日+1休息日）、必要医学指标确认后在第二次咨询进行。首诊仅反馈评估发现、解释干预逻辑、给出方向性建议区间、设定首个行为目标。（§7.1.4）'},

/* M8 - 10张 */
{m:8,f:'减脂赤字按TEE百分比设定的逻辑？',b:'同一500 kcal赤字对TEE=1800 kcal者是−28%激进赤字，对TEE=3200 kcal者是−16%中等赤字。固定千卡法不区分体型。三层分级：保守−10%~−12%（低体脂），标准−15%（中等），激进−20%~−25%（高体脂限4–6周）。（§8.1.1）'},
{m:8,f:'Helms等2014推荐的减脂期蛋白靶值？',b:'热量限制下抗阻训练者推荐2.3–3.1 g/kg FFM/d。需求随赤字严重程度和体脂率下降而上调。Refalo等2025贝叶斯荟萃回归确认蛋白剂量与FFM保留在所测范围内未出现平台。蛋白靶值按体脂率分层：越低越接近上限。（§8.1.2）'},
{m:8,f:'代谢适应的四个机制层面？',b:'①适应性产热下降（T4→rT3转化增加，瘦素48–72h内开始下降30%–50%）；②NEAT下降（可下降200–800 kcal/d，潜意识层面行为调整）；③RMR下调（每损失1kg FFM，RMR降20–30 kcal/d）；④激素适应（ghrelin升高、GLP-1/PYY下降）。（§8.1.3）'},
{m:8,f:'Diet Break与Refeed的核心区别？',b:'Diet Break：1天至2周，热量提至维持水平，蛋白维持+碳水脂肪灵活，核心为心理恢复+部分代谢缓解。Refeed：单日，高碳8–12 g/kg+低脂≤20%+蛋白维持，核心为糖原补充+瘦素脉冲。Diet Break直接代谢益处约47 kcal/d。（§8.1.4）'},
{m:8,f:'TEE校准方法（4周反推法）？',b:'组织能量密度近似7700 kcal/kg。实测日均赤字 = 实际减重(kg)×7700÷天数。真实TEE ≈ 实际摄入 + 实测日均赤字。示例：摄入2200 kcal/d，4周减2kg→实测赤字≈550→TEE≈2750。仅用于4周尺度粗略校准。（§8.1.5）'},
{m:8,f:'平台期处理决策树的第一步？',b:'第一步检查依从性：3天饮食记录与方案靶值对比，蛋白达标率<80%或总热量偏差>15%则不调整方案，回到执行支持。第二步检查NEAT变化（步数下降>2000步/d则增加步数，不调饮食）。第三步才评估代谢适应。（§8.1.5）'},
{m:8,f:'Longland等2016 RCT的关键发现？',b:'n=40，40%能量缺口+每周6次高强度训练。2.4 g/kg/d蛋白组4周后瘦体重增加1.2 kg、脂肪量减少4.8 kg；1.2 g/kg/d组瘦体重减少0.1 kg、脂肪量减少3.5 kg。高蛋白组在极端能量缺口下实现瘦体重净增长。（§8.1.2）'},
{m:8,f:'Murphy & Koehler 2022荟萃回归的核心结论？',b:'约500 kcal/d的赤字可完全抵消抗阻训练带来的瘦体重增长。赤字>500 kcal/d时瘦体重开始净流失。意味着即使有抗阻训练，赤字过大仍会导致肌肉流失。（§8.1.5）'},
{m:8,f:'Peak Week方案的适用边界？',b:'严格限定为三类：健美/形体比赛备赛最终阶段、健身模特商业拍摄短期体态调整、重量分级项目运动员称重前急性降重。面向已完成16–24周系统减脂、体脂率接近竞技目标者。大众健身教练不应将此方案用于普通减脂客户。（§8.2.1）'},
{m:8,f:'Mifflin-St Jeor公式的精度限制？',b:'预测均方根误差约±100–150 kcal/d，扩展人群中个体偏差±15%–20%是常态。对估算TEE=2200 kcal的来访者，真实TEE在1870–2530 kcal之间完全正常。将公式值当作精确处方是第4周"减不动"的最常见原因。（§8.1.1）'}
];

/* ============ Chip筛选 ============ */
const chipRow=document.getElementById('chipRow');
MODULES.forEach((m,i)=>{
  const c=document.createElement('button');
  c.className='chip'+(i===0?' active':'');
  c.textContent=m.name;
  c.dataset.mod=m.id;
  c.addEventListener('click',()=>{
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    curMod=m.id;
    renderCards();
  });
  chipRow.appendChild(c);
});

/* ============ 翻卡渲染 ============ */
const cardGrid=document.getElementById('cardGrid');
function renderCards(){
  cardGrid.innerHTML='';
  const list=curMod===0?FLASHCARDS:FLASHCARDS.filter(f=>f.m===curMod);
  list.forEach(f=>{
    const modName=MODULES.find(x=>x.id===f.m).name;
    const div=document.createElement('div');
    div.className='flip';
    div.innerHTML=`<div class="flip-inner"><div class="face front"><div class="fhead"><span class="fch">${modName}</span><span class="hint">点击翻转</span></div><div class="ftext">${f.f}</div></div><div class="face back"><div class="fhead"><span class="fch">${modName}</span><span class="hint">背面</span></div><div class="ftext">${f.b}</div></div></div>`;
    div.addEventListener('click',()=>div.classList.toggle('on'));
    cardGrid.appendChild(div);
  });
}
renderCards();

/* ============ 自测渲染 ============ */
const quizArea=document.getElementById('quizArea');
const scoreBanner=document.getElementById('scoreBanner');
const quizStart=document.getElementById('quizStart');
const quizRetry=document.getElementById('quizRetry');
let quizList=[];

quizStart.addEventListener('click',()=>{
  quizList=curMod===0?QUIZ_DATA:QUIZ_DATA.filter(q=>q.m===curMod);
  scoreBanner.style.display='none';
  quizArea.innerHTML='';
  quizList.forEach((q,i)=>{
    const modName=MODULES.find(x=>x.id===q.m).name;
    let html=`<div class="q-card" id="qc${i}"><div class="q-title"><span class="qno">${i+1}.</span><span class="tag">${modName}</span>${q.q}</div>`;
    q.opts.forEach((o,j)=>{
      html+=`<label class="q-opt"><input type="radio" name="q${i}" value="${j}">${String.fromCharCode(65+j)}. ${o}</label>`;
    });
    html+=`<div class="q-ex">${q.ex}</div></div>`;
    quizArea.innerHTML+=html;
  });
  quizArea.innerHTML+=`<div style="text-align:center;margin:18px 0;"><button class="btn" id="quizSubmit">提交并判分</button></div>`;
  document.getElementById('quizSubmit').addEventListener('click',gradeQuiz);
  quizStart.style.display='none';
  quizRetry.style.display='inline-block';
});

quizRetry.addEventListener('click',()=>{
  quizStart.click();
});

function gradeQuiz(){
  let correct=0;
  quizList.forEach((q,i)=>{
    const card=document.getElementById('qc'+i);
    const sel=document.querySelector(`input[name=q${i}]:checked`);
    card.classList.add('graded');
    if(sel&&parseInt(sel.value)===q.ans){
      card.classList.add('right');
      correct++;
      sel.parentElement.classList.add('ok-opt');
      card.querySelector('.q-title').innerHTML+=`<span class="q-verdict ok">✓ 正确</span>`;
    }else{
      card.classList.add('wrong');
      if(sel)sel.parentElement.classList.add('bad-opt');
      card.querySelectorAll('.q-opt')[q.ans].classList.add('ok-opt');
      card.querySelector('.q-title').innerHTML+=`<span class="q-verdict no">✗ 错误</span>`;
    }
  });
  const total=quizList.length;
  scoreBanner.innerHTML=`<h3>得分：${correct} / ${total}（${(correct/total*100).toFixed(0)}%）</h3><div>正确 ${correct} 题，错误 ${total-correct} 题</div>`;
  scoreBanner.style.display='block';
  scoreBanner.scrollIntoView({behavior:'smooth'});
}

  const db={'咖啡因':{g:'A',rec:'推荐',detail:'3–6 mg/kg运动前60min。耐力提升2%–7%，间歇运动提升1%–8%。注意CYP1A2基因多态性。',color:'green'},'一水肌酸':{g:'A',rec:'推荐',detail:'加载20g/d×5–7天→维持3–5g/d。力量和爆发力提升5%–10%。20%–30%为非响应者。',color:'green'},'β-丙氨酸':{g:'A',rec:'推荐',detail:'4–6g/d分次×10–12周。高强度1–4min提升1%–4%。适用短间歇高密度训练。',color:'green'},'硝酸盐（甜菜根汁）':{g:'A',rec:'推荐',detail:'6–8mmol NO₃⁻运动前2–2.5h。4–30min计时赛提升1%–3%。禁用抗菌漱口水。',color:'green'},'碳酸氢钠':{g:'A',rec:'推荐',detail:'200–300mg/kg运动前60–150min。适用1–7min高强度运动。注意GI副作用。',color:'green'},'蛋白粉（乳清）':{g:'A(运动食品)',rec:'条件推荐',detail:'当总蛋白摄入未达1.6g/kg/d时，蛋白粉可将已知有效营养素以剂量精准方式递送。食物优先。',color:'green'},'BCAA/亮氨酸':{g:'C',rec:'不推荐',detail:prot>=1.6?'总蛋白已达标（≥1.6g/kg/d），额外BCAA对MPS和瘦体重贡献接近零。支出重构至食物路径。':'总蛋白未达标时，优先增加食物蛋白而非补BCAA。',color:'yellow'},'HMB':{g:'C',rec:'不推荐',detail:'对训练有素者（≥6月）效应量接近零。ISSN仅推荐未训练初期和老年肌少症。',color:'yellow'},'左旋肉碱':{g:'C',rec:'不推荐',detail:'肌肉肉碱含量在正常饮食下已接近饱和。减脂效应在人体研究中总体阴性。支出重构至创建热量赤字。',color:'yellow'},'谷氨酰胺':{g:'C',rec:'不推荐',detail:'肌肉自身合成能力充足。对训练有素人群免疫支持和恢复加速声称缺乏人体证据。',color:'yellow'},'鱼油':{g:'B',rec:'可选',detail:'有新兴科学支持但需进一步研究。客户主动使用且有合理理由时不必强制反对。设定4–8周观察窗口。',color:'yellow'},'胶原蛋白':{g:'B',rec:'可选',detail:'有新兴科学支持。告知证据等级，设定观察窗口，无响应即停用。',color:'yellow'},'蒺藜（Tribulus）':{g:'D',rec:'禁用',detail:'含高污染历史。任何情况下不使用。明确建议停用，无论是否有兴奋剂检测义务。',color:'red'},'减脂胶囊（含专有配方）':{g:'高风险',rec:'警惕',detail:'有效成分剂量可能不足，专有配方规避剂量核查，复合污染概率高。默认警惕。',color:'red'},'ZMA':{g:'不推荐',rec:'不推荐',detail:'Wilborn 2004独立RCT显示锌正常者补充ZMA无睾酮/力量/体成分增益。',color:'yellow'},'维生素D3':{g:'A(医用补剂)',rec:'条件推荐',detail:'前提是实验室检测确认缺乏（25(OH)D<50 nmol/L）。内场馆训练者不足率37%–83%。补充剂量由医生决定。',color:'green'}};

}},
reds:{name:'RED-S风险筛查器',desc:'基于教材红线信号快速评估Relative Energy Deficiency in Sport风险',formula:'RED-S=相对能量缺乏综合征，低EA+月经紊乱+骨密度下降+免疫功能下降等',
inputs:[{id:'rd-sex',label:'性别',type:'select',opts:['女','男']},{id:'rd-bmi',label:'BMI',unit:'kg/m²',placeholder:'如 17.2'},{id:'rd-mens',label:'月经状态（女性）',type:'select',opts:['规律','不规律/稀少','停经>3个月','不适用（男性）']},{id:'rd-fatigue',label:'疲劳模式',type:'select',opts:['正常','持续疲劳>2周','伴静息心率升高']},{id:'rd-cal',label:'热量缺口',type:'select',opts:['无缺口','<500 kcal/d','≥500 kcal/d持续>8周','不确定']},{id:'rd-bone',label:'骨密度/应力性骨折史',type:'select',opts:['无异常','骨密度偏低','应力性骨折史']}],
calc(d){
  const sex=d['rd-sex'],bmi=parseFloat(d['rd-bmi'])||0,mens=d['rd-mens'],fatigue=d['rd-fatigue'],cal=d['rd-cal'],bone=d['rd-bone'];
  let score=0,flags=[];
  if(bmi>0&&bmi<17.5){score+=3;flags.push('BMI<17.5（饮食障碍/RED-S高危红线）');}
  else if(bmi>0&&bmi<18.5){score+=1;flags.push('BMI 17.5–18.5（偏低，关注）');}
  if(sex==='女'){if(mens==='不规律/稀少'){score+=2;flags.push('月经不规律/稀少（RED-S核心指标）');}if(mens==='停经>3个月'){score+=3;flags.push('停经>3个月（RED-S转介红线）');}}
  if(fatigue==='持续疲劳>2周'){score+=1;flags.push('持续疲劳>2周（非特异性RED-S信号）');}
  if(fatigue==='伴静息心率升高'){score+=2;flags.push('静息心率升高（铁缺乏/RED-S信号）');}
  if(cal==='≥500 kcal/d持续>8周'){score+=2;flags.push('热量缺口≥500 kcal/d持续>8周（RED-S风险因子）');}
  if(bone==='骨密度偏低'){score+=2;flags.push('骨密度偏低（RED-S核心指标）');}
  if(bone==='应力性骨折史'){score+=3;flags.push('应力性骨折史（RED-S转介红线）');}
  let level,color,detail;
  if(score>=5){level='高风险——触发转介';color='red';detail='多项RED-S红旗信号阳性。建议转介运动医学医师/注册营养专业人员多学科团队评估。停止自行调整方案。';}
  else if(score>=2){level='中等风险——建议筛查';color='yellow';detail='存在RED-S风险因子。建议实验室筛查（CBC、SF、激素水平）并增加监测频率。';}
  else{level='低风险';color='green';detail='当前未见明显RED-S红旗信号。继续常规监测，关注能量摄入充足性。';}
  return{html:`<p>风险评分：<b>${score}</b> 分</p>${flags.length?'<p>识别到的红旗信号：</p><ul>'+flags.map(f=>'<li>'+f+'</li>').join('')+'</ul>':''}<div class="verdict-box ${color}"><h4>${level}</h4><p>${detail}</p></div><p class="disclaimer">本筛查为教学工具，不构成医学诊断。RED-S的完整评估需要医师结合实验室指标和临床判断。</p>`}
}},
deficit:{name:'减脂热量缺口计算器',desc:'基于TEE百分比设定赤字幅度，判断分层',formula:'TEE = RMR × PAL；赤字 = TEE × 赤字比例',
inputs:[{id:'df-wt',label:'体重',unit:'kg',placeholder:'如 80'},{id:'df-ht',label:'身高',unit:'cm',placeholder:'如 175'},{id:'df-age',label:'年龄',unit:'岁',placeholder:'如 30'},{id:'df-sex',label:'性别',type:'select',opts:['男','女']},{id:'df-pal',label:'PAL系数',type:'select',opts:['1.2（久坐）','1.4（轻度活动）','1.55（中等活动）','1.725（高度活动）','1.9（极高活动）']},{id:'df-bf',label:'体脂率（可选）',unit:'%',placeholder:'如 22'}],
calc(d){
  const wt=parseFloat(d['df-wt']),ht=parseFloat(d['df-ht']),age=parseInt(d['df-age']),sex=d['df-sex'],palStr=d['df-pal'],bf=parseFloat(d['df-bf']);
  if(isNaN(wt)||isNaN(ht)||isNaN(age))return{err:'请填写完整的体重、身高和年龄'};
  const palMap={'1.2（久坐）':1.2,'1.4（轻度活动）':1.4,'1.55（中等活动）':1.55,'1.725（高度活动）':1.725,'1.9（极高活动）':1.9};
  const pal=palMap[palStr]||1.4;
  let rmr;
  if(sex==='男')rmr=10*wt+6.25*ht-5*age+5;
  else rmr=10*wt+6.25*ht-5*age-161;
  const tee=rmr*pal;
  let tier,pct,desc;
  if(!isNaN(bf)){
    if(sex==='男'&&bf<15||sex==='女'&&bf<22){tier='保守赤字';pct=0.11;desc='体脂率较低（男<15%/女<22%），保守赤字最大化瘦体重保留概率。';}
    else if(sex==='男'&&bf<25||sex==='女'&&bf<32){tier='标准赤字';pct=0.15;desc='体脂率中等区间（男15%–25%/女22%–32%），大多数临床健康健身人群的启动方案。';}
    else{tier='激进赤字（限4–6周）';pct=0.225;desc='起始体脂率较高（男≥25%/女≥32%），快速启动后降至第二层。';}
  }else{tier='标准赤字';pct=0.15;desc='未提供体脂率，默认标准赤字（−15% TEE）。建议测量体脂后校准。';}
  const deficit=tee*pct;
  const target=tee-deficit;
  const weeklyLoss=deficit*7/7700;
  return{html:`<table><tr><th>指标</th><th>结果</th></tr><tr><td>RMR（Mifflin-St Jeor）</td><td>${rmr.toFixed(0)} kcal/d</td></tr><tr><td>TEE（×${pal}）</td><td><b>${tee.toFixed(0)} kcal/d</b></td></tr><tr><td>推荐层级</td><td>${tier}</td></tr><tr><td>赤字幅度</td><td>−${pct*100}% = −${deficit.toFixed(0)} kcal/d</td></tr><tr><td>目标摄入</td><td><b>${target.toFixed(0)} kcal/d</b></td></tr><tr><td>预期减重速度</td><td>${weeklyLoss.toFixed(2)} kg/周</td></tr></table><div class="verdict-box ${pct>0.2?'yellow':pct>0.15?'green':'green'}"><h4>${tier}</h4>${desc}</div><p class="disclaimer">Mifflin公式个体偏差±15%–20%是常态。4周后需根据实测体重轨迹反推真实TEE并校准。公式值不是精确处方，而是估算起点。</p>`}
}},
macro:{name:'宏量营养素减脂分配器',desc:'基于蛋白保底策略分配三大宏量营养素',formula:'蛋白靶值按体脂率分层；脂肪20%–30% TEE；剩余热量分配给碳水',
inputs:[{id:'mc-wt',label:'体重',unit:'kg',placeholder:'如 80'},{id:'mc-bf',label:'体脂率',unit:'%',placeholder:'如 20'},{id:'mc-tee',label:'目标热量摄入',unit:'kcal/d',placeholder:'如 2000（赤字后目标值）'},{id:'mc-train',label:'训练状态',type:'select',opts:['无规律抗阻训练','规律抗阻训练≥3月','系统抗阻训练≥4次/wk≥1年']}],
calc(d){
  const wt=parseFloat(d['mc-wt']),bf=parseFloat(d['mc-bf']),tee=parseFloat(d['mc-tee']),train=d['mc-train'];
  if(isNaN(wt)||isNaN(tee))return{err:'请填写体重和目标热量'};
  let protMin,protMax,protRange;
  if(train==='无规律抗阻训练'){protMin=1.2;protMax=1.6;protRange='ISSN一般人群下限';}
  else if(train==='规律抗阻训练≥3月'){
    if(!isNaN(bf)&&((wt*(1-bf/100))>0)){
      const ffm=wt*(1-bf/100);
      if(bf>=28||bf<22&&true){}
    }
    if(!isNaN(bf)){
      if(bf>=20||(isNaN(bf))){protMin=1.6;protMax=2.0;protRange='ISSN基线';}
      else if(bf>=12){protMin=1.8;protMax=2.4;protRange='ISSN+Helms区间交集';}
      else{protMin=2.3;protMax=2.7;protRange='Helms 2014（深度赤字）';}
    }else{protMin=1.6;protMax=2.2;protRange='ISSN基线';}
  }else{protMin=2.3;protMax=3.1;protRange='Helms 2014（系统训练+深度赤字）';}
  if(!isNaN(bf)){
    if(bf>=20){protMin=1.6;protMax=2.0;}
    else if(bf>=12){protMin=1.8;protMax=2.4;}
    else{protMin=2.3;protMax=2.7;}
  }
  const protMid=(protMin+protMax)/2;
  const protKcal=wt*protMid*4;
  const fatMin=tee*0.20,fatMax=tee*0.30;
  const fatMid=(fatMin+fatMax)/2;
  const carbKcal=tee-protKcal-fatMid;
  const carbG=carbKcal/4;
  const fatG=fatMid/9;
  const protG=wt*protMid;
  return{html:`<table><tr><th>宏量营养素</th><th>靶值范围</th><th>推荐值</th><th>热量占比</th></tr><tr><td>蛋白质</td><td>${protMin}–${protMax} g/kg/d（${protRange}）</td><td><b>${protG.toFixed(0)} g/d</b></td><td>${(protKcal/tee*100).toFixed(0)}%</td></tr><tr><td>脂肪</td><td>20%–30% TEE</td><td><b>${fatG.toFixed(0)} g/d</b></td><td>${(fatMid/tee*100).toFixed(0)}%</td></tr><tr><td>碳水</td><td>剩余热量</td><td><b>${carbG.toFixed(0)} g/d</b></td><td>${(carbKcal/tee*100).toFixed(0)}%</td></tr></table><p>蛋白是刚性底线，不随碳水脂肪调整而下调。单餐分配按0.3–0.4 g/kg（含亮氨酸≥2.5–3.0 g）、每日4–5餐执行。</p><p class="disclaimer">纯植物蛋白饮食需将总蛋白靶值上浮10%–20%以补偿亮氨酸密度不足。超过3.0 g/kg/d通常无额外收益。</p>`}
}},
bfpred:{name:'体脂变化预测器',desc:'基于Hall动态能量平衡模型预测减脂轨迹',formula:'组织能量密度≈7700 kcal/kg；FFM损失占总体重损失10%–35%（按体脂率分层）',
inputs:[{id:'bf-wt',label:'当前体重',unit:'kg',placeholder:'如 85'},{id:'bf-bf',label:'当前体脂率',unit:'%',placeholder:'如 25'},{id:'bf-deficit',label:'日均热量缺口',unit:'kcal/d',placeholder:'如 500'},{id:'bf-weeks',label:'预测周数',unit:'周',placeholder:'如 12'}],
calc(d){
  const wt=parseFloat(d['bf-wt']),bf=parseFloat(d['bf-bf']),deficit=parseFloat(d['bf-deficit']),weeks=parseInt(d['bf-weeks']);
  if(isNaN(wt)||isNaN(bf)||isNaN(deficit)||isNaN(weeks))return{err:'请填写所有参数'};
  const fm=wt*bf/100;
  const ffm=wt-fm;
  const ffmRatio=bf<15?0.30:bf<25?0.20:0.12;
  const totalDeficit=deficit*weeks*7;
  const totalLoss=totalDeficit/7700;
  const fmLoss=totalLoss*(1-ffmRatio);
  const ffmLoss=totalLoss*ffmRatio;
  const newWt=wt-totalLoss;
  const newFm=fm-fmLoss;
  const newFfm=ffm-ffmLoss;
  const newBf=(newFm/newWt*100);
  const rmrLoss=ffmLoss*25;
  const weeklyLoss=totalLoss/weeks;
  return{html:`<table><tr><th>指标</th><th>预测值</th></tr><tr><td>总减重</td><td><b>${totalLoss.toFixed(1)} kg</b>（${weeklyLoss.toFixed(2)} kg/周）</td></tr><tr><td>其中脂肪量减少</td><td>${fmLoss.toFixed(1)} kg</td></tr><tr><td>其中FFM减少</td><td>${ffmLoss.toFixed(1)} kg</td></tr><tr><td>新体重</td><td>${newWt.toFixed(1)} kg</td></tr><tr><td>新体脂率</td><td><b>${newBf.toFixed(1)}%</b></td></tr><tr><td>RMR预估下降</td><td>约${rmrLoss.toFixed(0)} kcal/d（FFM损失导致）</td></tr></table><div class="verdict-box ${newBf<10?'yellow':'green'}"><h4>预测结果</h4>${weeks}周后预计体脂率从${bf}%降至${newBf.toFixed(1)}%。注意：这是静态估算，实际过程中TEE随体重下降和代谢适应而降低，赤字是动态收窄的。</div><p class="disclaimer">Hall 2012动态模型证明"每减1磅需3500 kcal"静态规则系统性高估长期减重。4周后应使用实测体重轨迹反推校准。FFM损失比例：高体脂者10%–15%，低体脂者25%–35%。</p>`}
}}
};

let curTool='vd';
function renderTool(){
  const t=TOOLS[curTool];
  let inputsHtml=t.inputs.map(inp=>{
    if(inp.type==='select'){
      return `<div class="field"><label>${inp.label}</label><select id="${inp.id}">${inp.opts.map(o=>`<option value="${o}">${o}</option>`).join('')}</select></div>`;
    }
    return `<div class="field"><label>${inp.label}${inp.unit?' ('+inp.unit+')':''}</label><input type="number" step="any" id="${inp.id}" placeholder="${inp.placeholder||''}"></div>`;
  }).join('');
  toolArea.innerHTML=`<div class="tool-card"><h3>${t.name}</h3><p style="color:var(--ink-soft);font-size:14px;margin:4px 0;">${t.desc}</p><div class="formula">${t.formula}</div><div class="form-grid">${inputsHtml}</div><button class="btn" id="toolCalc">计算</button><div class="result" id="toolResult"></div></div>`;
  document.getElementById('toolCalc').addEventListener('click',()=>{
    const data={};
    t.inputs.forEach(inp=>{data[inp.id]=document.getElementById(inp.id).value;});
    const res=t.calc(data);
    const el=document.getElementById('toolResult');
    if(res.err){el.innerHTML=`<div class="verdict-box red">${res.err}</div>`;el.classList.add('show');return;}
    el.innerHTML=res.html;el.classList.add('show');
  });
}
